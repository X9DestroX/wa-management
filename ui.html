/* v1.7.8 — refined professional light design; presentation-only overrides */
:root{
  --navy:#132b4f;
  --blue:#2457c5;
  --blue2:#eaf0fb;
  --bg:#f3f6fb;
  --card:#ffffff;
  --text:#17263b;
  --muted:#64748b;
  --border:#dfe6f0;
  --green:#167a52;
  --red:#b9384a;
  --gold:#c7a15a;
  --shadow:0 8px 26px rgba(19,43,79,.065);
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at top right, rgba(199,161,90,.055), transparent 34rem),
    var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(36,87,197,.16);color:var(--navy)}
a{color:var(--blue);transition:color .16s ease}
a:hover{color:#173d91}
.sidebar{
  background:rgba(255,255,255,.97);
  border-right:1px solid #dce4ef;
  box-shadow:6px 0 24px rgba(19,43,79,.025);
  padding-top:26px;
}
.brand{padding-bottom:30px}
.brand-mark{
  background:linear-gradient(145deg,#173a69,#102747);
  border:1px solid rgba(199,161,90,.75);
  box-shadow:0 5px 14px rgba(19,43,79,.15);
}
.brand strong{color:var(--navy);letter-spacing:-.025em;font-size:16px}
.brand small{color:#718096;font-size:11px}
.sidebar nav{gap:6px}
.nav-link{
  position:relative;
  padding:12px 13px 12px 15px;
  border:1px solid transparent;
  border-radius:10px;
  color:#52627a;
  font-size:13px;
  font-weight:650;
  transition:background .16s ease,color .16s ease,border-color .16s ease,transform .16s ease;
}
.nav-link:hover{background:#f0f4fb;color:var(--navy);border-color:#e7edf6;transform:translateX(1px)}
.nav-link.active{
  color:#163866;
  background:linear-gradient(100deg,#edf3fd,#f7f9fe);
  border-color:#dce6f6;
  box-shadow:inset 3px 0 0 var(--gold);
  font-weight:750;
}
.side-bottom{border-top-color:#e2e8f1}
.avatar{background:#eef3fc;color:#214e9b;border:1px solid #dfe8f8}
.logout{font-weight:600;transition:color .16s ease}
.logout:hover{color:var(--blue)}
.main{padding:30px 36px 54px}
.topbar{align-items:center;margin-bottom:26px;gap:18px}
.eyebrow{color:#7b8ba3;letter-spacing:.15em;font-size:10px}
.topbar h1{color:#102747;font-weight:800;letter-spacing:-.045em;font-size:30px}
.top-user{gap:10px;color:#5f6e83}
.network-pill{padding:6px 11px;font-size:10px;box-shadow:0 2px 8px rgba(22,122,82,.055)}
.network-pill.client{box-shadow:0 2px 8px rgba(36,87,197,.055)}
.role-pill{background:#f0f3f8;border:1px solid #e1e7f0;color:#46566d;padding:5px 10px}
.toolbar{gap:15px;margin-bottom:20px}
.date-filter label,.form-grid label,.report-controls label,.login-card label{color:#40516a;font-weight:700}
.date-filter input,.form-grid input,.form-grid select,.form-grid textarea,
.report-controls input,.report-controls select,.login-card input{
  border:1px solid #dbe3ef;
  border-radius:10px;
  background:#fff;
  box-shadow:0 1px 2px rgba(19,43,79,.025);
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;
}
.date-filter input:hover,.form-grid input:hover,.form-grid select:hover,.form-grid textarea:hover,
.report-controls input:hover,.report-controls select:hover,.login-card input:hover{border-color:#c5d2e4}
.date-filter input:focus,.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus,
.report-controls input:focus,.report-controls select:focus,.login-card input:focus{
  border-color:#7d9fe2;
  box-shadow:0 0 0 3px rgba(36,87,197,.12);
}
.btn{
  border-radius:10px;
  padding:10px 15px;
  font-weight:750;
  letter-spacing:-.01em;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease;
}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{
  background:linear-gradient(135deg,#2b60cc,#1e478f);
  color:#fff;
  box-shadow:0 4px 10px rgba(36,87,197,.18);
}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#2457c5,#183d7d);box-shadow:0 7px 16px rgba(36,87,197,.22)}
.btn.secondary{background:#fff;color:#18365e;border:1px solid #d9e2ef;box-shadow:0 1px 2px rgba(19,43,79,.025)}
.btn.secondary:hover:not(:disabled){background:#f7f9fd;border-color:#c6d3e5;box-shadow:0 4px 10px rgba(19,43,79,.05)}
.stats-grid{gap:16px}
.stat-card,.panel{
  border:1px solid #e0e7f1;
  border-radius:17px;
  box-shadow:var(--shadow);
  background:rgba(255,255,255,.98);
}
.stat-card{padding:21px 20px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.stat-card:hover{transform:translateY(-2px);border-color:#d5e0ef;box-shadow:0 13px 30px rgba(19,43,79,.09)}
.stat-card span,.stat-card small{color:#708097}
.stat-card strong{color:#132b4f;font-size:26px}
.split-grid{gap:16px;margin-top:16px}
.panel{padding:22px}
.panel-head{gap:12px;padding-bottom:14px;border-bottom:1px solid #edf1f7;margin-bottom:16px}
.panel-head h2{font-size:16px;color:#183252;letter-spacing:-.025em}
.panel-head p{color:#75849a;line-height:1.55}
.device-box{border-color:#e1e8f2;background:linear-gradient(135deg,#fff,#fbfcff);transition:border-color .16s ease,transform .16s ease}
.device-box:hover{border-color:#cad8eb;transform:translateY(-1px)}
.gps{background:#edf3ff;color:#285dc5}
.star{background:#eaf7f0;color:#167a52}
.big-number{color:#132b4f}
.table-wrap{border-radius:10px;scrollbar-color:#b7c4d5 #f2f5f9;scrollbar-width:thin}
table{font-size:12px}
th{color:#718198;background:#f8fafd;font-size:10px;font-weight:800;letter-spacing:.075em;border-top:1px solid #e8edf5;border-bottom:1px solid #e3eaf4}
td{color:#394a61;border-color:#e8edf5;vertical-align:middle}
tbody tr{transition:background .14s ease}
tbody tr:hover{background:#f8fafe}
.table-sub{color:#8997aa}
.tag{background:#edf2f8;color:#4d5e75;border:1px solid #e2e8f1}
.empty{color:#8795a9;padding:30px 18px}
.page-grid{gap:17px}
.form-panel{box-shadow:0 8px 24px rgba(19,43,79,.05)}
.form-grid{gap:15px}
.form-actions{padding-top:7px}
.icon-btn{padding:5px 7px;border-radius:7px;font-weight:650;transition:background .14s ease,color .14s ease}
.icon-btn:hover{background:#eff4fc;color:var(--blue)}
.danger{color:var(--red)}
.alert{border-radius:10px;line-height:1.45}
.alert.success{background:#eef9f3;border-color:#ccebd9;color:#176443}
.alert.error{background:#fff1f2;border-color:#f5cbd0;color:#9b2738}
.login-page{
  background:radial-gradient(circle at 15% 15%,rgba(199,161,90,.16),transparent 23rem),
             radial-gradient(circle at 86% 82%,rgba(36,87,197,.11),transparent 27rem),
             #f2f5fa;
}
.login-card{
  border:1px solid #dfe6f0;
  border-radius:20px;
  padding:34px;
  box-shadow:0 24px 60px rgba(19,43,79,.12);
  position:relative;
  overflow:hidden;
}
.login-card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--navy),var(--blue),var(--gold))}
.login-copy h1{color:#132b4f;font-size:28px}
.login-copy p{color:#687a91}
.login-card form{gap:16px}
.login-card input{padding:12px 13px}
.demo-box{background:#f7f9fc;border-color:#e2e8f1;border-radius:12px}
.modalback{background:rgba(12,27,48,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{border:1px solid #dfe6f0;border-radius:18px;box-shadow:0 24px 72px rgba(10,26,49,.24)}
.modal h2{color:#132b4f;letter-spacing:-.03em}
.modalfoot{gap:10px}
.report-controls{gap:13px}
.report-summary{gap:14px}
.expense-page{gap:17px}
.product-tools{gap:9px;margin:14px 0}
.import-preview{border:1px solid #e3eaf4;border-radius:12px;padding:12px;background:#fcfdff}
.import-preview .table-wrap{border-radius:8px}
.import-error{color:#b9384a}
.import-valid{color:#167a52}
.scanner-video{border:1px solid #ccd6e4;box-shadow:0 6px 18px rgba(19,43,79,.09)}
.scanner-reader{border-radius:10px;overflow:hidden}
.scanner-status{border:1px solid #dfe7f2;background:#f5f8fc;color:#4b5e78;border-radius:10px;line-height:1.5}
:focus-visible{outline:3px solid rgba(36,87,197,.35);outline-offset:2px}
button:disabled{filter:saturate(.5)}
@media(max-width:1000px){.main{padding-left:25px;padding-right:25px}.panel{padding:18px}}
@media(max-width:700px){
  .sidebar{box-shadow:2px 0 12px rgba(19,43,79,.04)}
  .sidebar .brand-mark{width:36px;height:36px}
  .nav-link{border-radius:9px}
  .nav-link.active{box-shadow:inset 0 3px 0 var(--gold);border-color:#dce6f6}
  .main{padding:17px 14px 34px}
  .topbar{margin-bottom:19px;align-items:flex-start}
  .topbar h1{font-size:25px}
  .panel,.stat-card{border-radius:14px}
  .panel{padding:15px}
  .report-summary{grid-template-columns:1fr 1fr}
  .login-card{padding:28px 22px}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

  .panel-head{border-bottom-color:#ddd!important}
  th{background:#f2f2f2!important;color:#222!important}
}

function loginScreen(msg=''){$('loginView').innerHTML=`<div class="login-page"><div class="login-card">
<div class="brand login-brand"><div class="brand-mark">EA</div><div><strong>W-A Systeme de Gestion</strong><small>Opérations de l’entreprise</small></div></div>
<div class="login-copy"><h1>Bienvenue</h1><p>Connectez-vous pour gérer les opérations quotidiennes, les dépôts financiers et les ventes d’appareils.</p></div>
${msg?`<div class="alert error">${esc(msg)}</div>`:''}
<form onsubmit="event.preventDefault();login()"><label>E-mail (cloud) / nom d’utilisateur (LAN)<input id="username" autocomplete="username" required autofocus></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary full" type="submit">Se connecter</button></form>
</div></div>`}
loginScreen();
async function login(){try{const identity=$('username').value.trim();let x=await api('/api/login','POST',{username:identity,email:identity,password:$('password').value});token=x.token;user=x.user;renderApp();await loadNetworkStatus();showPage('dashboard')}catch(e){loginScreen(e.message)}}
async function loadNetworkStatus(){try{const n=await api('/api/network');const el=$('networkStatus');if(!el)return;cloudMode=n.role==='cloud';const client=n.role==='client';el.className='network-pill'+((client||cloudMode)?' client':'');el.innerHTML=`<span class="network-dot"></span>${cloudMode?'Cloud connecté':(client?'LAN connecté':'Serveur LAN')}`;el.title=cloudMode?'Données centralisées dans Supabase':(client?`Connecté à ${n.server}:${n.port}`:`Serveur : ${n.local_ip}:${n.port}`)}catch(e){const el=$('networkStatus');if(el){el.className='network-pill client';el.innerHTML='<span class="network-dot"></span>Hors ligne'}}}
function renderApp(){ $('loginView').style.display='none'; $('appView').style.display='block'; $('appView').innerHTML=`<div class="app-shell">
<aside class="sidebar"><div class="brand"><div class="brand-mark">EA</div><div><strong>W-A Systeme de Gestion</strong><small>Système de gestion</small></div></div>
<nav><a id="nav-dashboard" class="nav-link" onclick="showPage('dashboard')">Tableau de bord</a><a id="nav-deposits" class="nav-link" onclick="showPage('deposits')">Finance / Dépôts</a><a id="nav-sales" class="nav-link" onclick="showPage('sales')">Ventes d’appareils</a><a id="nav-products" class="nav-link" onclick="showPage('products')">Produits et stock</a><a id="nav-reports" class="nav-link" onclick="showPage('reports')">Rapports</a><a id="nav-users" class="nav-link" onclick="showPage('users')">Utilisateurs et accès</a>${canViewAudit()?`<a id="nav-audit" class="nav-link" onclick="showPage('audit')">Journaux d’activité</a>`:''}</nav>
<div class="side-bottom"><div class="user-mini"><div class="avatar">${esc((user.full_name||user.username)[0].toUpperCase())}</div><div><strong>${esc(user.full_name||user.username)}</strong><small>${esc(user.role)}</small></div></div><a class="logout" onclick="logout()">Se déconnecter</a></div></aside>
<main class="main"><header class="topbar"><div><span class="eyebrow">COMPANY OPERATIONS</span><h1 id="heading">Tableau de bord</h1></div><div class="top-user"><span id="networkStatus" class="network-pill"><span class="network-dot"></span>Serveur LAN</span>${esc(user.full_name||user.username)} <span class="role-pill">${esc(user.role)}</span></div></header><div id="alerts"></div><div id="content"></div></main></div>`}
function activate(p){['dashboard','deposits','sales','products','reports','users','audit'].forEach(x=>$('nav-'+x)?.classList.toggle('active',x===p));currentPage=p}
function isSystemSuperadmin(u=user){return String(u?.username||'').toLowerCase()==='destrox'&&u?.role==='Superadmin'}
function canManageUsers(u=user){return u?.role==='Administrateur'||isSystemSuperadmin(u)}
function canViewAudit(u=user){return u?.role==='Administrateur'||isSystemSuperadmin(u)}
function isProtectedSuperadminAccount(a){return String(a?.username||'').toLowerCase()==='destrox'||a?.role==='Superadmin'}
async function logout(){try{if(token)await api('/api/logout','POST',{})}catch(e){}token='';user=null;$('appView').style.display='none';$('loginView').style.display='block';loginScreen()}
async function showPage(p){if(p==='audit'&&!canViewAudit()){flash('Accès réservé à l’administrateur.','error');return}currentPage=p;activate(p);$('heading').textContent=({'dashboard':'Tableau de bord','deposits':'Finance et dépôts','sales':'Ventes d’appareils','products':'Produits et stock','reports':'Rapports','users':'Utilisateurs et accès','audit':'Journaux d’activité'})[p]||'Tableau de bord';try{if(p==='dashboard')await dashboard();if(p==='deposits')await deposits();if(p==='sales')await sales();if(p==='products')await productsPage();if(p==='reports')await reports();if(p==='users')await users();if(p==='audit')await auditLogs()}catch(e){$('content').innerHTML=`<div class="alert error">${esc(e.message)}</div>`}}
function flash(msg,kind='success'){$('alerts').innerHTML=`<div class="alert ${kind}">${esc(msg)}</div>`;setTimeout(()=>{if($('alerts'))$('alerts').innerHTML=''},3500)}
async function dashboard(){let d=await api('/api/dashboard?date='+currentDate);$('content').innerHTML=`<section class="toolbar"><form class="date-filter" onsubmit="event.preventDefault()"><label>Date des opérations<input type="date" value="${currentDate}" onchange="currentDate=this.value;dashboard()"></label></form><div class="actions"><button class="btn secondary" onclick="openDeposit()">+ Dépôt</button><button class="btn primary" onclick="openSale()">+ Enregistrer une vente</button></div></section>
<div class="stats-grid"><div class="stat-card"><span>Déposé en finance</span><strong>${money(d.deposits)}</strong><small>Jour sélectionné</small></div><div class="stat-card"><span>Chiffre d’affaires appareils</span><strong>${money(d.revenue)}</strong><small>GPS + Starlink</small></div><div class="stat-card"><span>Abonnements</span><strong>${money(d.subscriptions)}</strong><small>Abonnements enregistrés</small></div><div class="stat-card"><span>Dépenses enregistrées</span><strong>${money(d.expenses)}</strong><small>Charges entreprise et charges liées aux ventes</small></div></div>
<div class="split-grid"><section class="panel"><div class="panel-head"><div><h2>Vue d’ensemble des ventes</h2><p>Appareils enregistrés le ${currentDate}</p></div></div><div class="device-overview"><div class="device-box"><span class="device-icon gps">G</span><div><strong>${d.gps}</strong><small>Appareils GPS</small></div></div><div class="device-box"><span class="device-icon star">S</span><div><strong>${d.starlink}</strong><small>Appareils Starlink</small></div></div></div></section>
<section class="panel"><div class="panel-head"><div><h2>Position du jour</h2><p>Chiffre d’affaires moins les dépenses enregistrées</p></div></div><div class="big-number">${money(Number(d.revenue)-Number(d.expenses))}</div><div class="muted">Valeur opérationnelle avant les autres charges de l’entreprise</div></section></div>
<div class="split-grid"><section class="panel"><div class="panel-head"><h2>Ventes récentes d’appareils</h2><a onclick="showPage('sales')">Voir tout</a></div>${salesTable(d.recent||[],true)}</section><section class="panel"><div class="panel-head"><h2>Dépôts récents</h2><a onclick="showPage('deposits')">Voir tout</a></div>${depositTable(d.recent_deposits||[])}</section></div>`}
function salesTable(a,compact=false){
if(!a.length)return '<div class="empty">Aucune vente enregistrée.</div>';
if(compact)return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Client</th><th>Type GPS</th><th>Montant</th><th>Total abonnement</th><th>Total à payer</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc((x.sold_at||'').replace('T',' '))}</td><td>${esc(x.client_name||'-')}</td><td>${esc(x.gps_type||x.device_type||'-')}</td><td><strong>${money(x.amount)}</strong></td><td>${money(x.subscription)}</td><td><strong>${money(x.total_amount||x.amount)}</strong></td></tr>`).join('')}</tbody></table></div>`;
const gpsSales=a.filter(x=>String(x.device_type||'').toUpperCase()==='GPS');
const starlinkSales=a.filter(x=>String(x.device_type||'').toUpperCase()==='STARLINK');
const otherSales=a.filter(x=>!['GPS','STARLINK'].includes(String(x.device_type||'').toUpperCase()));
const gpsTable=rows=>`<div class="table-wrap"><table><thead><tr><th>Date et heure</th><th>Produit / quantité</th><th>Client</th><th>Téléphone</th><th>N° SIM</th><th>Type GPS</th><th>Montant</th><th>SIM + activation</th><th>Abonnement / mois</th><th>Nombre</th><th>Total abonnement</th><th>Total à payer</th><th>Abonnement effectué</th><th>Adresse</th><th>Note</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc((x.sold_at||'').replace('T',' '))}</td><td>${esc(x.device_name||'GPS')} · Qté ${Number(x.quantity||1)}</td><td>${esc(x.client_name||'-')}</td><td>${esc(x.mobile||'-')}</td><td>${esc(x.sim_number||x.device_phone||'-')}</td><td>${esc(x.gps_type||'-')}</td><td><strong>${money(x.amount)}</strong></td><td>${money(x.sim_cost||3000)}</td><td>${money(x.billed_subscription_monthly||3000)}</td><td>${x.subscription_months??0}</td><td>${money(x.subscription)}</td><td><strong>${money(x.total_amount||x.amount)}</strong></td><td>${x.subscription_done?'Oui':'Non'}</td><td>${esc(x.address||'-')}</td><td>${esc(x.notes||'-')}</td><td><button class="icon-btn" onclick='editSale(${JSON.stringify(x)})'>Modifier</button> <button class="icon-btn danger" onclick="deleteSale(${x.id})">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`;
const starlinkTable=rows=>`<div class="table-wrap"><table><thead><tr><th>Type d’appareil</th><th>Montant à payer</th><th>Date et heure</th><th>Note</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.device_name||'Starlink')}<span class="table-sub">Qté ${Number(x.quantity||1)}</span></td><td><strong>${money(x.amount)}</strong></td><td>${esc((x.sold_at||'').replace('T',' '))}</td><td>${esc(x.notes||'-')}</td><td><button class="icon-btn" onclick='editSale(${JSON.stringify(x)})'>Modifier</button> <button class="icon-btn danger" onclick="deleteSale(${x.id})">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`;
const otherTable=rows=>`<div class="table-wrap"><table><thead><tr><th>Type d’appareil</th><th>Montant à payer</th><th>Date et heure</th><th>Note</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.device_name||x.device_type||'-')}<span class="table-sub">${esc(x.device_type||'-')} · Qté ${Number(x.quantity||1)}</span></td><td><strong>${money(x.amount)}</strong></td><td>${esc((x.sold_at||'').replace('T',' '))}</td><td>${esc(x.notes||'-')}</td><td><button class="icon-btn" onclick='editSale(${JSON.stringify(x)})'>Modifier</button> <button class="icon-btn danger" onclick="deleteSale(${x.id})">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`;
return `${gpsSales.length?`<section style="margin-bottom:24px"><div class="panel-head"><h3 style="margin:0;font-size:14px">Ventes GPS</h3></div>${gpsTable(gpsSales)}</section>`:''}${starlinkSales.length?`<section style="margin-bottom:24px"><div class="panel-head"><h3 style="margin:0;font-size:14px">Ventes Starlink</h3></div>${starlinkTable(starlinkSales)}</section>`:''}${otherSales.length?`<section style="margin-bottom:24px"><div class="panel-head"><h3 style="margin:0;font-size:14px">Autres appareils</h3></div>${otherTable(otherSales)}</section>`:''}`;
}
function depositTable(a){if(!a.length)return '<div class="empty">Aucun dépôt enregistré.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Référence</th><th>Montant</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc((x.created_at||'').replace('T',' '))}</td><td>${esc(x.reference||'Dépôt financier')}</td><td><strong>${money(x.amount)}</strong></td></tr>`).join('')}</tbody></table></div>`}
async function deposits(){let x=await api('/api/deposits');let ex=await api('/api/expenses');$('content').innerHTML=`<div class="expense-page"><div class="page-grid"><section class="panel form-panel"><div class="panel-head"><div><h2>Enregistrer un dépôt</h2><p>Montant versé sur le compte de l’entreprise ou au service financier.</p></div></div><div class="form-grid"><label>Montant<input id="dAmount" type="number" min="0"></label><label>Date<input id="dDate" type="date" value="${currentDate}"></label><label>Service<input id="dDept" value="Finance"></label><label>Référence / reçu<input id="dRef" placeholder="Facultatif"></label><label>Déposé par<input id="dBy" placeholder="Nom du personnel"></label><label>Notes<textarea id="dNotes" rows="3"></textarea></label><div class="form-actions"><button class="btn primary" onclick="saveDeposit()">Enregistrer le dépôt</button></div></div></section><section class="panel"><div class="panel-head"><div><h2>Historique des dépôts</h2><p>Tous les dépôts financiers enregistrés.</p></div></div>${depositHistory(x.items)}</section></div><div class="page-grid"><section class="panel form-panel"><div class="panel-head"><div><h2>Enregistrer une dépense</h2><p>Charges courantes : transport, loyer, matériel, salaires ou autres dépenses.</p></div></div><div class="form-grid"><label>Montant (FCFA)<input id="xAmount" type="number" min="0" required></label><label>Date et heure<input id="xDate" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"></label><label>Catégorie<select id="xCategory"><option>Transport</option><option>Loyer</option><option>Électricité / Internet</option><option>Matériel</option><option>Salaires</option><option>Frais bancaires</option><option>Approvisionnement</option><option>Maintenance</option><option>Autre</option></select></label><label>Mode de paiement<select id="xPayment"><option>Espèces</option><option>Airtel Money</option><option>Virement bancaire</option><option>Carte</option><option>Autre</option></select></label><label>Bénéficiaire<input id="xPaidTo" placeholder="Personne ou fournisseur"></label><label>Référence / reçu<input id="xRef" placeholder="Numéro de pièce, reçu... "></label><label class="wide-field">Description<textarea id="xDescription" rows="2" placeholder="Objet de la dépense"></textarea></label><label class="wide-field">Notes<textarea id="xNotes" rows="2"></textarea></label><div class="form-actions"><button class="btn primary" onclick="saveExpense()">Enregistrer la dépense</button></div></div></section><section class="panel"><div class="panel-head"><div><h2>Registre des dépenses</h2><p>Historique des charges de l’entreprise.</p></div></div>${expenseHistory(ex.items)}</section></div></div>`}
function depositHistory(a){if(!a.length)return '<div class="empty">Aucun dépôt pour le moment.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Montant</th><th>Service</th><th>Référence</th><th>Par</th><th>Actions</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc((x.created_at||'').slice(0,10))}</td><td><strong>${money(x.amount)}</strong></td><td>${esc(x.department||'Finance')}</td><td>${esc(x.reference||'-')}</td><td>${esc(x.deposited_by||'-')}</td><td><button class="icon-btn" onclick='editDeposit(${JSON.stringify(x)})'>Modifier</button> <button class="icon-btn danger" onclick="deleteDeposit(${x.id})">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`}
async function saveDeposit(){try{await api('/api/deposits','POST',{amount:Number($('dAmount').value),department:$('dDept').value,reference:$('dRef').value,deposited_by:$('dBy').value,notes:$('dNotes').value,created_at:$('dDate').value+' 00:00:00'});closeModal();flash('Dépôt enregistré avec succès.');showPage('deposits')}catch(e){alert(e.message)}}
async function sales(){let x=await api('/api/sales');let pr=await api('/api/products');productItems=pr.items||[];const available=productItems.filter(p=>p.is_active&&Number(p.stock_quantity)>0);const options=`<option value="">Choisir un produit du catalogue…</option>${available.map(p=>`<option value="${esc(p.id)}">${esc(p.category)} — ${esc(p.product_name)} · ${money(p.selling_price)} · Stock ${Number(p.stock_quantity)}</option>`).join('')}`;$('content').innerHTML=`<section class="panel form-panel"><div class="panel-head"><div><h2>Enregistrer une vente</h2><p>Choisissez un produit du catalogue. Le prix vient de sa fiche produit et le stock sera mis à jour automatiquement. Pour le GPS, les 3 000 FCFA de SIM + activation incluent le premier mois.</p></div><button class="btn secondary" onclick="showPage('products')">Gérer les produits</button></div><div class="form-grid wide">
<label class="wide-field">Produit du catalogue<select id="sProductId" onchange="saleProductChanged()" required>${options}</select></label><label>Type d’appareil<input id="sType" readonly value=""></label><label>Quantité vendue<input id="sQuantity" type="number" min="1" value="1" required oninput="saleProductChanged(true)"></label><label id="sAmountLabel">Montant à payer (prix catalogue)<input id="sAmount" type="number" min="0" readonly required placeholder="Choisissez un produit"></label><label class="gps-only">Nom du client<input id="sClient"></label><label class="gps-only">Numéro de téléphone<input id="sMobile"></label><label class="gps-only">Numéro du SIM<input id="sSimNumber"></label><label class="gps-only">Type du GPS<select id="sGpsType"><option value="Moto">Moto</option><option value="Voiture">Voiture</option><option value="Camion">Camion</option></select></label><label class="gps-only">SIM + Activation<input id="sSimActivation" type="number" value="3000" readonly></label><label class="gps-only">Abonnement / mois<input id="sSubMonthly" type="number" value="3000" readonly></label><label class="gps-only">Nombre d’abonnement supplémentaire<input id="sMonths" type="number" min="0" value="0" oninput="saleCalc()"></label><label class="gps-only">Total d’abonnement<input id="sTotalSub" type="number" value="0" readonly></label><label class="gps-only">Total à payer<input id="sTotalAmount" type="number" value="0" readonly></label><label class="gps-only">Abonnement effectué<select id="sSubDone"><option value="yes">Oui</option><option value="no">Non</option></select></label><label class="gps-only wide-field">Adresse<textarea id="sAddress" rows="2"></textarea></label><label>Date et heure<input id="sDate" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"></label><label class="wide-field">Note<textarea id="sNotes" rows="2"></textarea></label><div class="form-actions"><button class="btn primary" onclick="saveSale()">Enregistrer la vente</button></div></div></section>
<section class="panel"><div class="panel-head"><div><h2>Registre des ventes</h2><p>Historique complet des opérations GPS et appareils. Les ventes liées au catalogue indiquent la quantité vendue.</p></div></div>${salesTable(x.items,false)}</section>`;saleProductChanged()}
function selectedProduct(id){return productItems.find(p=>String(p.id)===String(id||''))}
function saleProductChanged(recalc=true){if(!$('sProductId'))return;const p=selectedProduct($('sProductId').value);const qty=Math.max(1,Number($('sQuantity').value)||1);if(!p){$('sType').value='';$('sAmount').value='';document.querySelectorAll('.gps-only').forEach(e=>e.style.display='none');$('sAmountLabel').firstChild.textContent='Montant à payer (prix catalogue)';$('sAmount').placeholder='Choisissez un produit';$('sAmount').readOnly=true;$('sTotalSub').value=0;$('sTotalAmount').value=0;return}if(recalc||!$('sAmount').value)$('sAmount').value=Number(p.selling_price||0)*qty;$('sType').value=p.category;$('sAmountLabel').firstChild.textContent=p.category.toUpperCase()==='GPS'?'Montant des appareils':'Montant à payer';$('sAmount').placeholder='Prix calculé depuis le catalogue';$('sAmount').readOnly=true;const gps=String(p.category||'').trim().toUpperCase()==='GPS';document.querySelectorAll('.gps-only').forEach(e=>e.style.display=gps?'flex':'none');if(gps){$('sSimActivation').value=3000*qty;$('sSubMonthly').value=3000;$('sMonths').value=Math.max(0,Number($('sMonths').value)||0);saleCalc()}else{$('sTotalSub').value=0;$('sTotalAmount').value=Number($('sAmount').value)||0}}
function saleTypeChanged(){saleProductChanged()}
function saleCalc(){if(!$('sMonths'))return;const qty=Math.max(1,Number($('sQuantity')?.value)||1);let months=Math.max(0,Number($('sMonths').value)||0);let base=Number($('sAmount').value)||0;$('sTotalSub').value=3000*months*qty;$('sTotalAmount').value=base+(3000*qty)+(3000*months*qty)}
async function saveSale(){const productId=$('sProductId')?.value;const product=selectedProduct(productId);const qty=Math.max(1,Number($('sQuantity')?.value)||1);if(!productId||!product){alert('Veuillez sélectionner un produit du catalogue.');return}if(!product.is_active||Number(product.stock_quantity)<qty){alert('La quantité demandée dépasse le stock disponible. Actualisez le catalogue.');return}try{await api('/api/sales','POST',{product_id:Number(productId),quantity:qty,device_type:product.category,device_name:product.product_name,client_name:$('sClient')?.value||'',mobile:$('sMobile')?.value||'',device_phone:'',sim_number:$('sSimNumber')?.value||'',gps_type:$('sGpsType')?.value||'',address:$('sAddress')?.value||'',setup_by:'',amount:Number($('sAmount').value)||0,subscription_months:Number($('sMonths')?.value)||0,subscription:Number($('sTotalSub')?.value)||0,subscription_done:$('sSubDone')?.value==='yes',sold_at:$('sDate').value,notes:$('sNotes').value});flash('Vente enregistrée. Le stock a été mis à jour.');showPage('sales')}catch(e){alert(e.message)}}

function productHistoryTable(rows){if(!rows.length)return '<div class="empty">Aucun mouvement de stock pour le moment.</div>';const labels={stock_initial:'Stock initial',ajustement:'Ajustement',vente:'Vente',retour_vente:'Retour de vente'};return `<div class="table-wrap"><table><thead><tr><th>Date et heure</th><th>Produit</th><th>Catégorie</th><th>Mouvement</th><th>Variation</th><th>Référence</th><th>Par</th><th>Note</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${esc((m.created_at||'').replace('T',' ').slice(0,19))}</td><td>${esc(m.product_name||('Produit #'+m.product_id))}</td><td>${esc(m.category||'-')}</td><td>${esc(labels[m.movement_type]||m.movement_type||'-')}</td><td><strong style="color:${Number(m.quantity_delta)>0?'#15803d':'#b91c1c'}">${Number(m.quantity_delta)>0?'+':''}${Number(m.quantity_delta)}</strong></td><td>${esc(m.reference_table?m.reference_table+' #'+(m.reference_id||''):'-')}</td><td>${esc(m.actor_username||'-')}</td><td>${esc(m.notes||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function productTable(rows){if(!rows.length)return '<div class="empty">Aucun produit enregistré. Ajoutez votre premier produit ci-dessus.</div>';return `<div class="table-wrap"><table><thead><tr><th>Catégorie</th><th>Nom du produit</th><th>Code-barres / QR</th><th>Prix de vente</th><th>Quantité en stock</th><th>Notes</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.category)}</td><td><strong>${esc(p.product_name)}</strong></td><td>${esc(p.barcode_qr||'-')}</td><td><strong>${money(p.selling_price)}</strong></td><td><strong style="color:${Number(p.stock_quantity)<=2?'#b45309':'#172033'}">${Number(p.stock_quantity||0)}</strong></td><td>${esc(p.notes||'-')}</td><td>${p.is_active?'<span class="role-pill">Actif</span>':'<span class="role-pill">Archivé</span>'}</td><td><button class="icon-btn" onclick='editProduct(${JSON.stringify(p)})'>Modifier</button> ${p.is_active?`<button class="icon-btn danger" onclick="archiveProduct(${p.id})">Archiver</button>`:`<button class="icon-btn" onclick="reactivateProduct(${p.id})">Réactiver</button>`}</td></tr>`).join('')}</tbody></table></div>`}
async function productsPage(){const [x,m]=await Promise.all([api('/api/products'),api('/api/stock-movements')]);productItems=x.items||[];$('content').innerHTML=`<div class="page-grid"><section class="panel form-panel"><div class="panel-head"><div><h2>Ajouter un produit</h2><p>Les six champs du catalogue. La quantité initiale crée un mouvement de stock.</p></div></div><div class="form-grid"><label>Catégorie<input id="pCategory" list="productCategories" required placeholder="Starlink, MikroTik, GPS…"><datalist id="productCategories"><option>Starlink</option><option>MikroTik</option><option>GPS</option><option>Accessoires</option><option>Autre</option></datalist></label><label>Nom du produit<input id="pName" required placeholder="Starlink Mini, V2, V4…"></label><label class="wide-field">Code-barres / QR code<div class="input-action-row"><input id="pBarcode" placeholder="Scanner ou saisir le code manuellement"><button class="btn secondary" type="button" onclick="openBarcodeScanner('pBarcode')">Scanner</button></div></label><label>Prix de vente (FCFA)<input id="pPrice" type="number" min="0" step="0.01" value="0" required></label><label>Quantité en stock<input id="pQuantity" type="number" min="0" step="1" value="0" required></label><label class="wide-field">Notes<textarea id="pNotes" rows="3" placeholder="Facultatif"></textarea></label><div class="form-actions"><button class="btn primary" onclick="saveProduct()">Ajouter le produit</button></div></div><div class="product-tools"><button class="btn secondary" onclick="openBarcodeScanner('pBarcode')">Scanner un code</button><button class="btn secondary" onclick="triggerProductImport()">Importer Excel / CSV</button><button class="btn secondary" onclick="downloadProductTemplate()">Télécharger le modèle CSV</button><input id="productImportFile" type="file" accept=".xlsx,.csv" style="display:none" onchange="previewProductImport(this.files&&this.files[0])"></div><p class="muted">Formats acceptés : Excel .xlsx et CSV. Un aperçu et un contrôle des doublons sont présentés avant l’importation.</p></section><section class="panel"><div class="panel-head"><div><h2>Catalogue des produits</h2><p>Le stock est partagé entre tous les utilisateurs connectés à Supabase.</p></div><button class="btn secondary" onclick="productsPage()">Actualiser</button></div>${productTable(productItems)}</section></div><div id="productImportPreview"></div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Historique des mouvements de stock</h2><p>Entrées initiales, ventes, ajustements et retours après suppression de vente.</p></div></div>${productHistoryTable(m.items||[])}</section>`}
function triggerProductImport(){const f=$('productImportFile');if(f){f.value='';f.click()}}
function downloadProductTemplate(){const headers=['Catégorie','Nom du produit','Code-barres / QR code','Prix de vente','Quantité en stock','Notes'];const csv='\ufeff'+headers.map(x=>'"'+x.replaceAll('"','""')+'"').join(';')+'\r\n';const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='modele_import_produits.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function previewProductImport(file){if(!file)return;const ext=(file.name.split('.').pop()||'').toLowerCase();if(!['csv','xlsx'].includes(ext)){alert('Choisissez un fichier .xlsx ou .csv.');return}if(file.size>8*1024*1024){alert('Le fichier dépasse 8 Mo. Divisez-le en plusieurs fichiers.');return}try{const buf=await file.arrayBuffer();const bytes=new Uint8Array(buf);let binary='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));const encoded=btoa(binary);const result=await api('/api/products/import-preview','POST',{filename:file.name,file_base64:encoded});pendingProductImport=result.items||[];renderProductImportPreview(result.summary||{});$('productImportPreview')?.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){alert('Impossible de lire le fichier : '+e.message)}finally{const el=$('productImportFile');if(el)el.value=''}}
function renderProductImportPreview(summary){const target=$('productImportPreview');if(!target)return;const valid=pendingProductImport.filter(x=>x.valid);const display=pendingProductImport.slice(0,100);target.innerHTML=`<section class="panel import-preview"><div class="panel-head"><div><h2>Aperçu de l’importation</h2><p>${Number(summary.total||pendingProductImport.length)} ligne(s) · <span class="import-valid">${valid.length} prête(s) à importer</span> · <span class="import-error">${pendingProductImport.length-valid.length} ignorée(s) / à corriger</span></p><p class="muted">Les doublons de code-barres sont écartés. Rien n’est enregistré avant confirmation.</p></div><button class="btn secondary" onclick="cancelProductImport()">Annuler</button></div><div class="table-wrap"><table><thead><tr><th>Ligne</th><th>Catégorie</th><th>Produit</th><th>Code-barres / QR</th><th>Prix (FCFA)</th><th>Quantité</th><th>Contrôle</th></tr></thead><tbody>${display.map(r=>`<tr><td>${Number(r.row_number)}</td><td>${esc(r.category||'-')}</td><td>${esc(r.product_name||'-')}</td><td>${esc(r.barcode_qr||'-')}</td><td>${esc(money(r.selling_price||0))}</td><td>${Number(r.stock_quantity||0)}</td><td class="${r.valid?'import-valid':'import-error'}">${r.valid?'Prête':esc((r.errors||[]).join(' '))}</td></tr>`).join('')}</tbody></table></div>${pendingProductImport.length>100?`<p class="muted">Aperçu limité aux 100 premières lignes; l’import peut inclure toutes les lignes validées.</p>`:''}<div class="modalfoot"><button class="btn secondary" onclick="cancelProductImport()">Annuler</button><button class="btn primary" ${valid.length?'':'disabled'} onclick="confirmProductImport()">Importer ${valid.length} produit(s)</button></div></section>`}
function cancelProductImport(){pendingProductImport=[];const t=$('productImportPreview');if(t)t.innerHTML=''}
async function confirmProductImport(){const valid=pendingProductImport.filter(x=>x.valid).map(x=>({row_number:x.row_number,category:x.category,product_name:x.product_name,barcode_qr:x.barcode_qr,selling_price:x.selling_price,stock_quantity:x.stock_quantity,notes:x.notes}));if(!valid.length){alert('Aucun produit valide à importer.');return}if(!confirm(`Importer ${valid.length} produit(s) dans le catalogue cloud ? Les quantités initiales seront enregistrées dans l’historique de stock.`))return;try{const r=await api('/api/products/import-confirm','POST',{items:valid});let msg=`Import terminé : ${r.imported||0} produit(s) importé(s), ${r.skipped||0} ignoré(s).`;if((r.errors||[]).length)msg+='\n\nDétails :\n'+r.errors.slice(0,15).map(x=>`Ligne ${x.row_number}: ${(x.errors||[]).join(' ')}`).join('\n');alert(msg);pendingProductImport=[];await showPage('products')}catch(e){alert('Échec de l’importation : '+e.message)}}
function openBarcodeScanner(targetId='pBarcode'){scannerTargetId=targetId;scannerActive=false;let overlay=$('scannerOverlay');if(!overlay){overlay=document.createElement('div');overlay.id='scannerOverlay';overlay.className='modalback';overlay.style.zIndex='60';document.body.appendChild(overlay)}overlay.innerHTML=`<div class="modal" style="width:min(720px,100%)"><h2>Scanner un code-barres / QR</h2><p class="muted">Autorisez l’accès à la caméra puis placez le code dans le cadre. Le code détecté remplira le champ du produit sans fermer votre formulaire.</p><video id="scannerVideo" class="scanner-video" autoplay muted playsinline style="display:none"></video><div id="scannerReader" class="scanner-reader" style="display:none"></div><div id="scannerStatus" class="scanner-status">Appuyez sur « Démarrer la caméra ». Sur un ordinateur, utilisez la webcam; sur un mobile, utilisez la caméra arrière dans un navigateur compatible.</div><div class="modalfoot"><button class="btn secondary" onclick="stopBarcodeScanner()">Arrêter</button><button class="btn primary" onclick="startBarcodeScanner()">Démarrer la caméra</button><button class="btn secondary" onclick="closeBarcodeScanner()">Fermer</button></div></div>`;overlay.style.display='flex'}
function closeBarcodeScanner(){stopBarcodeScanner();const overlay=$('scannerOverlay');if(overlay)overlay.style.display='none'}
async function loadHtml5Qr(){if(window.Html5Qrcode)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('La bibliothèque du scanner n’a pas pu être chargée. Vérifiez Internet ou saisissez le code manuellement.'));document.head.appendChild(s)})}
function scannerFound(value){const code=String(value||'').trim();if(!code)return;const target=$(scannerTargetId);if(target){target.value=code;target.dispatchEvent(new Event('input',{bubbles:true}))}closeBarcodeScanner();flash('Code détecté : '+code);}
async function startBarcodeScanner(){const status=$('scannerStatus');try{await stopBarcodeScanner();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Caméra indisponible dans cet environnement. Utilisez un scanner USB ou saisissez le code manuellement.');scannerActive=true;if('BarcodeDetector'in window){const supported=await window.BarcodeDetector.getSupportedFormats().catch(()=>[]);const wanted=['qr_code','code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','data_matrix','pdf417','aztec'];const formats=wanted.filter(x=>supported.includes(x));const detector=new BarcodeDetector({formats:formats.length?formats:undefined});scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=$('scannerVideo');video.style.display='block';$('scannerReader').style.display='none';video.srcObject=scannerStream;await video.play();if(status)status.textContent='Caméra active — placez le code au centre de l’image.';const detect=async()=>{if(!scannerActive)return;try{if(video.readyState>=2){const found=await detector.detect(video);if(found&&found.length){scannerFound(found[0].rawValue);return}}}catch(e){}scannerTimer=setTimeout(detect,250)};detect();return}await loadHtml5Qr();$('scannerVideo').style.display='none';$('scannerReader').style.display='block';html5Scanner=new Html5Qrcode('scannerReader');await html5Scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:180}},decoded=>scannerFound(decoded),()=>{});if(status)status.textContent='Caméra active — placez le code au centre de l’image.'}catch(e){scannerActive=false;if(status)status.textContent=e.message||'Impossible de démarrer le scanner.';alert(e.message||'Impossible de démarrer le scanner.')}}
async function stopBarcodeScanner(){scannerActive=false;if(scannerTimer){clearTimeout(scannerTimer);scannerTimer=null}if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}const video=$('scannerVideo');if(video){try{video.pause();video.srcObject=null}catch(e){}}if(html5Scanner){const old=html5Scanner;html5Scanner=null;try{await old.stop();await old.clear()}catch(e){}}}

async function saveProduct(){try{const body={category:$('pCategory').value,product_name:$('pName').value,barcode_qr:$('pBarcode').value,selling_price:Number($('pPrice').value),stock_quantity:Number($('pQuantity').value),notes:$('pNotes').value};await api('/api/products','POST',body);flash('Produit ajouté au catalogue.');showPage('products')}catch(e){alert(e.message)}}
function editProduct(p){$('modalBack').style.display='flex';$('modal').innerHTML=`<h2>Modifier le produit</h2><p class="muted">Une modification de quantité sera ajoutée à l’historique des mouvements.</p><div class="form-grid"><label>Catégorie<input id="epCategory" value="${esc(p.category)}" required></label><label>Nom du produit<input id="epName" value="${esc(p.product_name)}" required></label><label class="wide-field">Code-barres / QR code<div class="input-action-row"><input id="epBarcode" value="${esc(p.barcode_qr||'')}"><button class="btn secondary" type="button" onclick="openBarcodeScanner('epBarcode')">Scanner</button></div></label><label>Prix de vente (FCFA)<input id="epPrice" type="number" min="0" step="0.01" value="${esc(p.selling_price)}"></label><label>Quantité en stock<input id="epQuantity" type="number" min="0" step="1" value="${Number(p.stock_quantity||0)}"></label><label class="wide-field">Notes<textarea id="epNotes" rows="3">${esc(p.notes||'')}</textarea></label></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="updateProduct(${p.id},${p.is_active?'true':'false'})">Enregistrer</button></div>`}
async function updateProduct(id,isActive){try{await api('/api/products/'+id+'/edit','POST',{category:$('epCategory').value,product_name:$('epName').value,barcode_qr:$('epBarcode').value,selling_price:Number($('epPrice').value),stock_quantity:Number($('epQuantity').value),notes:$('epNotes').value,is_active:isActive});closeModal();flash('Produit modifié.');showPage('products')}catch(e){alert(e.message)}}
async function archiveProduct(id){if(!confirm('Archiver ce produit ? Il ne sera plus disponible pour de nouvelles ventes, mais les historiques seront conservés.'))return;try{await api('/api/products/'+id,'DELETE');flash('Produit archivé.');showPage('products')}catch(e){alert(e.message)}}
async function reactivateProduct(id){const p=selectedProduct(id);if(!p)return;try{await api('/api/products/'+id+'/edit','POST',{category:p.category,product_name:p.product_name,barcode_qr:p.barcode_qr||'',selling_price:Number(p.selling_price),stock_quantity:Number(p.stock_quantity),notes:p.notes||'',is_active:true});flash('Produit réactivé.');showPage('products')}catch(e){alert(e.message)}}
function expenseHistory(a){if(!a.length)return '<div class="empty">Aucune dépense enregistrée.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Montant</th><th>Catégorie</th><th>Bénéficiaire</th><th>Paiement</th><th>Référence</th><th>Actions</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc((x.incurred_at||'').replace('T',' ').slice(0,16))}</td><td><strong>${money(x.amount)}</strong></td><td>${esc(x.category||'Autre')}</td><td>${esc(x.paid_to||'-')}</td><td>${esc(x.payment_method||'-')}</td><td>${esc(x.reference||'-')}</td><td><button class="icon-btn" onclick='editExpense(${JSON.stringify(x)})'>Modifier</button> <button class="icon-btn danger" onclick="deleteExpense(${x.id})">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`}
async function saveExpense(){const amount=$('xAmount').value;if(amount===''){alert('Veuillez saisir le montant de la dépense.');return}try{await api('/api/expenses','POST',{amount:Number(amount),category:$('xCategory').value,description:$('xDescription').value,paid_to:$('xPaidTo').value,payment_method:$('xPayment').value,reference:$('xRef').value,notes:$('xNotes').value,incurred_at:$('xDate').value});flash('Dépense enregistrée avec succès.');showPage('deposits')}catch(e){alert(e.message)}}
function editExpense(x){$('modalBack').style.display='flex';$('modal').innerHTML=`<h2>Modifier la dépense</h2><div class="form-grid"><label>Montant (FCFA)<input id="exAmount" type="number" min="0" value="${esc(x.amount)}"></label><label>Date et heure<input id="exDate" type="datetime-local" value="${esc((x.incurred_at||'').replace(' ','T').slice(0,16))}"></label><label>Catégorie<select id="exCategory">${['Transport','Loyer','Électricité / Internet','Matériel','Salaires','Frais bancaires','Approvisionnement','Maintenance','Autre'].map(v=>`<option ${v===(x.category||'Autre')?'selected':''}>${v}</option>`).join('')}</select></label><label>Mode de paiement<select id="exPayment">${['Espèces','Airtel Money','Virement bancaire','Carte','Autre'].map(v=>`<option ${v===(x.payment_method||'Autre')?'selected':''}>${v}</option>`).join('')}</select></label><label>Bénéficiaire<input id="exPaidTo" value="${esc(x.paid_to||'')}"></label><label>Référence<input id="exRef" value="${esc(x.reference||'')}"></label><label class="wide-field">Description<textarea id="exDescription" rows="2">${esc(x.description||'')}</textarea></label><label class="wide-field">Notes<textarea id="exNotes" rows="2">${esc(x.notes||'')}</textarea></label></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="updateExpense(${JSON.stringify(String(x.id))})">Enregistrer les modifications</button></div>`}
async function updateExpense(id){try{await api('/api/expenses/'+encodeURIComponent(id)+'/edit','POST',{amount:Number($('exAmount').value),category:$('exCategory').value,description:$('exDescription').value,paid_to:$('exPaidTo').value,payment_method:$('exPayment').value,reference:$('exRef').value,notes:$('exNotes').value,incurred_at:$('exDate').value});closeModal();flash('Dépense modifiée avec succès.');showPage('deposits')}catch(e){alert(e.message)}}
async function deleteExpense(id){if(!confirm('Supprimer cette dépense ?'))return;try{await api('/api/expenses/'+encodeURIComponent(id),'DELETE');flash('Dépense supprimée.');showPage('deposits')}catch(e){alert(e.message)}}

async function reports(){const initialPeriod=window.reportPeriod||'weekly';const initialDate=window.reportDate||currentDate;const r=await api('/api/reports?period='+encodeURIComponent(initialPeriod)+'&date='+encodeURIComponent(initialDate));renderReport(r,initialPeriod,initialDate)}
function renderReport(r,period,date){window.reportPeriod=period;window.reportDate=date;const s=r.summary;const salesRows=r.sales||[];const depositRows=r.deposits||[];const expenseRows=r.expenses||[];const moneyCell=v=>`<strong>${money(v)}</strong>`;$('content').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Rapports hebdomadaires et mensuels</h2><p>Analyse consolidée des ventes, abonnements, dépôts et dépenses enregistrées dans le cloud.</p></div></div><div class="report-controls no-print"><label>Période<select id="reportPeriod" onchange="loadReport()"><option value="weekly" ${period==='weekly'?'selected':''}>Hebdomadaire (lundi à dimanche)</option><option value="monthly" ${period==='monthly'?'selected':''}>Mensuel (mois civil)</option></select></label><label>Date de référence<input id="reportDate" type="date" value="${esc(date)}" onchange="loadReport()"></label><div class="report-actions"><button class="btn primary" onclick="exportReportPDF()">Exporter le rapport en PDF</button><button class="btn secondary" onclick="window.print()">Imprimer / Enregistrer en PDF</button></div></div><div class="report-print-only"><h2>${esc(r.label)}</h2><p>Du ${esc(r.start_date)} au ${esc(r.end_date)}</p></div><p class="muted">Période : ${esc(r.start_date)} au ${esc(r.end_date)}</p><div class="report-summary"><div class="stat-card"><span>Chiffre d’affaires</span><strong>${money(s.revenue)}</strong><small>${s.sales_count} vente(s)</small></div><div class="stat-card"><span>Abonnements encaissés</span><strong>${money(s.subscriptions)}</strong><small>Montants d’abonnements liés aux ventes</small></div><div class="stat-card"><span>Dépôts financiers</span><strong>${money(s.deposits)}</strong><small>${s.deposits_count} dépôt(s)</small></div><div class="stat-card"><span>Dépenses entreprise</span><strong>${money(s.company_expenses)}</strong><small>${s.expenses_count} dépense(s)</small></div><div class="stat-card"><span>Dépenses enregistrées sur les ventes</span><strong>${money(s.sale_expenses)}</strong><small>Anciennes charges liées aux ventes</small></div><div class="stat-card"><span>Position opérationnelle</span><strong>${money(s.net_operating)}</strong><small>Chiffre d’affaires moins toutes les dépenses enregistrées</small></div></div><section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><h2>Résumé des appareils vendus</h2><p>GPS : ${s.gps_count} · Starlink : ${s.starlink_count}</p></div></div>${reportSalesTable(salesRows)}</section><section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><h2>Dépôts financiers</h2><p>Total : ${money(s.deposits)}</p></div></div>${depositHistoryReadOnly(depositRows)}</section><section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><h2>Dépenses de l’entreprise</h2><p>Total : ${money(s.company_expenses)}</p></div></div>${reportExpenseTable(expenseRows)}</section><section class="panel"><div class="panel-head"><div><h2>Dépenses liées aux ventes</h2><p>Total : ${money(s.sale_expenses)}</p></div></div>${reportSaleExpenseTable(salesRows)}</section></section>`}
async function loadReport(){const period=$('reportPeriod').value;const date=$('reportDate').value||currentDate;try{const r=await api('/api/reports?period='+encodeURIComponent(period)+'&date='+encodeURIComponent(date));renderReport(r,period,date)}catch(e){alert(e.message)}}
async function exportReportPDF(){const period=$('reportPeriod')?.value||window.reportPeriod||'weekly';const date=$('reportDate')?.value||window.reportDate||currentDate;try{const response=await fetch('/api/reports/pdf?period='+encodeURIComponent(period)+'&date='+encodeURIComponent(date),{headers:{Authorization:'Bearer '+token}});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok){throw new Error(result.error||'Impossible d’enregistrer le PDF.')}flash('PDF enregistré dans Téléchargements.');alert('Rapport PDF enregistré avec succès.\n\nFichier : '+result.filename+'\n\nEmplacement complet :\n'+result.saved_path+'\n\nVous pouvez copier ce chemin dans la barre d’adresse de l’Explorateur de fichiers Windows.')}catch(e){alert(e.message)}}
function reportSalesTable(rows){if(!rows.length)return '<div class="empty">Aucune vente sur cette période.</div>';const gps=rows.filter(x=>String(x.device_type).toUpperCase()==='GPS');const star=rows.filter(x=>String(x.device_type).toUpperCase()==='STARLINK');const other=rows.filter(x=>!['GPS','STARLINK'].includes(String(x.device_type).toUpperCase()));const t=(items,headers,cells)=>!items.length?'':`<h3>${headers[0]}</h3><div class="table-wrap"><table><thead><tr>${headers.slice(1).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${items.map(x=>`<tr>${cells(x).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;return `${t(gps,['Ventes GPS','Date','Client','Téléphone','N° SIM','Type GPS','Montant','Abonnement','Total à payer','Adresse','Note'],x=>[esc((x.sold_at||'').replace('T',' ').slice(0,16)),esc(x.client_name||'-'),esc(x.mobile||'-'),esc(x.sim_number||x.device_phone||'-'),esc(x.gps_type||'-'),money(x.amount),money(x.subscription),money(x.total_amount??x.amount),esc(x.address||'-'),esc(x.notes||'-')])}${t(star,['Ventes Starlink','Date','Type d’appareil','Montant à payer','Note'],x=>[esc((x.sold_at||'').replace('T',' ').slice(0,16)),esc((x.device_name||'Starlink')+' · Qté '+Number(x.quantity||1)),money(x.amount),esc(x.notes||'-')])}${t(other,['Autres ventes','Date','Type','Total à payer','Note'],x=>[esc((x.sold_at||'').replace('T',' ').slice(0,16)),esc(x.device_type||'-'),money(x.total_amount??x.amount),esc(x.notes||'-')])}`}
function depositHistoryReadOnly(rows){if(!rows.length)return '<div class="empty">Aucun dépôt sur cette période.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Montant</th><th>Service</th><th>Référence</th><th>Déposé par</th><th>Notes</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc((x.created_at||'').replace('T',' ').slice(0,16))}</td><td>${money(x.amount)}</td><td>${esc(x.department||'Finance')}</td><td>${esc(x.reference||'-')}</td><td>${esc(x.deposited_by||'-')}</td><td>${esc(x.notes||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function reportExpenseTable(rows){if(!rows.length)return '<div class="empty">Aucune dépense entreprise sur cette période.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Montant</th><th>Catégorie</th><th>Bénéficiaire</th><th>Mode de paiement</th><th>Référence</th><th>Description / notes</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc((x.incurred_at||'').replace('T',' ').slice(0,16))}</td><td>${money(x.amount)}</td><td>${esc(x.category||'Autre')}</td><td>${esc(x.paid_to||'-')}</td><td>${esc(x.payment_method||'-')}</td><td>${esc(x.reference||'-')}</td><td>${esc(x.description||x.notes||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function reportSaleExpenseTable(rows){const items=rows.filter(x=>Number(x.expenses||0)!==0);if(!items.length)return '<div class="empty">Aucune dépense associée aux ventes sur cette période.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Client / appareil</th><th>Dépenses</th><th>Note</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc((x.sold_at||'').replace('T',' ').slice(0,16))}</td><td>${esc(x.device_type||'-')}</td><td>${esc(x.client_name||x.device_name||'-')}</td><td>${money(x.expenses)}</td><td>${esc(x.notes||'-')}</td></tr>`).join('')}</tbody></table></div>`}

function auditOperationLabel(a){const op=String(a.operation||'').toUpperCase();const act=String(a.action||'');if(/^(Ajout|Modification|Suppression|Connexion|Déconnexion)/i.test(act))return act;if(op==='INSERT')return 'Ajout';if(op==='UPDATE')return 'Modification';if(op==='DELETE')return 'Suppression';if(op==='LOGIN')return 'Connexion réussie';if(op==='LOGOUT')return 'Déconnexion';if(act.toLowerCase().includes('create'))return 'Création utilisateur';if(act.toLowerCase().includes('update'))return 'Modification utilisateur';if(act.toLowerCase().includes('delete'))return 'Suppression utilisateur';if(act.toLowerCase().includes('connexion'))return act;return act||'Action'}
function auditEntityLabel(a){const t=String(a.entity_table||'').toLowerCase();const details=typeof a.details==='string'?(()=>{try{return JSON.parse(a.details)}catch{return {}}})():(a.details||{});const table=t||details.table||((String(a.action||'').includes('users')||String(a.action||'').includes('utilisateur'))?'profiles':'');const names={sales:'Vente',deposits:'Dépôt',expenses:'Dépense',profiles:'Utilisateur',auth:'Session'};const id=a.entity_id||details.record_id||details.target_id||details.id||'';return (names[table]||table||'—')+(id?' #'+id:'')}
function auditDetailText(a){let details=a.details;if(typeof details==='string'){try{details=JSON.parse(details)}catch{}}const hasSnapshots=a.before_data||a.after_data;const payload=hasSnapshots?{avant:a.before_data||null,après:a.after_data||null}:(details||{});let s='';try{s=JSON.stringify(payload,null,2)}catch{s=String(payload)}return s&&s!=='{}'?s:'Aucun détail supplémentaire.'}
async function auditLogs(){if(!canViewAudit())throw new Error('La consultation des journaux est réservée à l’administrateur ou au Superadmin.');const x=await api('/api/audit');window.auditItems=x.items||[];$('content').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Journaux d’activité</h2><p>Connexions, ajouts, modifications et suppressions. Les événements sont horodatés et associés au compte employé.</p></div><button class="btn secondary" onclick="auditLogs()">Actualiser</button></div><div class="report-controls no-print" style="margin-bottom:14px"><label>Rechercher<input id="auditSearch" placeholder="Nom, e-mail, action, référence…" oninput="filterAuditLogs()"></label><label>Type d’événement<select id="auditType" onchange="filterAuditLogs()"><option value="">Tous les événements</option><option value="LOGIN">Connexion</option><option value="LOGOUT">Déconnexion</option><option value="INSERT">Ajout</option><option value="UPDATE">Modification</option><option value="DELETE">Suppression</option></select></label></div><div id="auditTable"></div></section>`;filterAuditLogs()}
function filterAuditLogs(){const all=window.auditItems||[];const q=($('auditSearch')?.value||'').toLowerCase();const typ=$('auditType')?.value||'';const rows=all.filter(a=>{const search=[a.username,a.actor_email,a.actor_role,a.action,a.entity_table,a.entity_id,a.details,a.before_data,a.after_data].map(v=>typeof v==='object'?JSON.stringify(v):String(v||'')).join(' ').toLowerCase();const op=String(a.operation||'').toUpperCase();return (!q||search.includes(q))&&(!typ||op===typ||(typ==='INSERT'&&String(a.action||'').toLowerCase().includes('create'))||(typ==='UPDATE'&&String(a.action||'').toLowerCase().includes('update'))||(typ==='DELETE'&&String(a.action||'').toLowerCase().includes('delete'))||(typ==='LOGIN'&&String(a.action||'').toLowerCase().includes('connexion'))||(typ==='LOGOUT'&&String(a.action||'').toLowerCase().includes('déconnexion')))});const target=$('auditTable');if(!target)return;if(!rows.length){target.innerHTML='<div class="empty">Aucun événement ne correspond aux filtres.</div>';return}target.innerHTML=`<div class="muted" style="margin-bottom:8px">${rows.length} événement(s) affiché(s), maximum 500 plus récents.</div><div class="table-wrap"><table><thead><tr><th>Date et heure</th><th>Employé</th><th>Rôle</th><th>Action</th><th>Élément</th><th>Détails</th></tr></thead><tbody>${rows.map(a=>{const dt=String(a.created_at||'').replace('T',' ').replace('Z',' UTC').slice(0,25);const role=a.actor_role||'';return `<tr><td>${esc(dt||'-')}</td><td>${esc(a.actor_email||a.username||'-')}</td><td>${esc(role||'-')}</td><td>${esc(auditOperationLabel(a))}</td><td>${esc(auditEntityLabel(a))}</td><td><details><summary>Voir les détails</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;max-width:440px;max-height:300px;overflow:auto;background:#f8fafc;padding:10px;border-radius:8px;font-size:11px">${esc(auditDetailText(a))}</pre></details></td></tr>`}).join('')}</tbody></table></div>`}

async function users(){let x=await api('/api/users');let manager=canManageUsers(),superadmin=isSystemSuperadmin();$('content').innerHTML=`<div class="page-grid">${manager?`<section class="panel form-panel"><div class="panel-head"><div><h2>Créer un utilisateur</h2><p>Ajouter un compte RH, Gestionnaire ou Administrateur. Le compte Superadmin destrox est réservé et ne peut pas être créé ici.</p></div></div><div class="form-grid">${cloudMode?'<label>Adresse e-mail<input id="uEmail" type="email" required></label>':''}<label>Nom complet<input id="uFull"></label><label>Nom d’utilisateur<input id="uName" required></label><label>Mot de passe<input id="uPass" type="password" minlength="${cloudMode?12:1}" required></label><label>Rôle<select id="uRole"><option>RH</option><option>Gestionnaire</option><option>Administrateur</option></select></label><div class="form-actions"><button class="btn primary" onclick="saveUser()">Créer l’utilisateur</button></div></div></section>`:''}<section class="panel"><div class="panel-head"><div><h2>Comptes utilisateurs</h2><p>${superadmin?'Superadmin : gestion de tous les comptes. Le compte destrox reste protégé contre la suppression et le changement de rôle/nom.':manager?'Vous pouvez gérer les comptes ordinaires. Le compte Superadmin destrox est protégé.':'Consultation uniquement : seuls les administrateurs et le Superadmin peuvent gérer les utilisateurs.'}</p></div></div><div class="table-wrap"><table><thead><tr><th>Nom</th><th>Nom d’utilisateur</th>${cloudMode&&manager?'<th>E-mail</th>':''}<th>Rôle</th><th>Créé le</th>${manager?'<th>Actions</th>':''}</tr></thead><tbody>${x.items.map(a=>{const protectedAccount=isProtectedSuperadminAccount(a);const mayEdit=manager&&(!protectedAccount||superadmin);const mayDelete=manager&&!protectedAccount&&String(a.id)!==String(user.id);return `<tr><td>${esc(a.full_name||'-')}</td><td>${esc(a.username)}</td>${cloudMode&&manager?`<td>${esc(a.email||'-')}</td>`:''}<td><span class="role-pill">${esc(a.role)}</span></td><td>${esc(a.created_at||'-')}</td>${manager?`<td>${mayEdit?`<button class="icon-btn" onclick='editUser(${JSON.stringify(a)})'>Modifier</button>`:''} ${mayDelete?`<button class="icon-btn danger" onclick='deleteUser(${JSON.stringify(String(a.id))})'>Supprimer</button>`:''}${protectedAccount&&!superadmin?'<span class="muted">Compte protégé</span>':''}</td>`:''}</tr>`}).join('')}</tbody></table></div></section></div>`}
function editUser(a){if(!canManageUsers())return;const superadmin=isSystemSuperadmin();const protectedAccount=isProtectedSuperadminAccount(a);if(protectedAccount&&!superadmin)return;const fixedProtected=protectedAccount; $('modalBack').style.display='flex';$('modal').innerHTML=`<h2>Modifier l’utilisateur</h2><p class="muted">${fixedProtected?'Compte système protégé : nom d’utilisateur et rôle sont fixes.':'Gestion des comptes réservée à l’administrateur ou au Superadmin.'}</p><div class="form-grid">${cloudMode?`<label>Adresse e-mail<input id="eEmail" type="email" value="${esc(a.email||'')}"></label>`:''}<label>Nom complet<input id="eFull" value="${esc(a.full_name||'')}"></label><label>Nom d’utilisateur<input id="eName" value="${esc(a.username)}" ${fixedProtected?'readonly':''}></label><label>Nouveau mot de passe<input id="ePass" type="password" minlength="${cloudMode?12:1}" placeholder="Laisser vide pour conserver le mot de passe actuel"></label>${fixedProtected?`<label>Rôle<select id="eRole" disabled><option selected>Superadmin</option></select></label>`:`<label>Rôle<select id="eRole"><option ${a.role==='RH'?'selected':''}>RH</option><option ${a.role==='Gestionnaire'?'selected':''}>Gestionnaire</option><option ${a.role==='Administrateur'?'selected':''}>Administrateur</option></select></label>`}</div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Annuler</button><button class="btn primary" onclick='updateUser(${JSON.stringify(String(a.id))})'>Enregistrer les modifications</button></div>`}
async function updateUser(id){if(!canManageUsers())return;try{await api('/api/users/'+encodeURIComponent(id)+'/edit','POST',{email:$('eEmail')?.value||'',username:$('eName').value,full_name:$('eFull').value,password:$('ePass').value,role:$('eRole').value});closeModal();flash('Compte utilisateur modifié avec succès.');showPage('users')}catch(e){alert(e.message)}}
async function saveUser(){if(!canManageUsers())return;try{await api('/api/users','POST',{email:$('uEmail')?.value||'',username:$('uName').value,password:$('uPass').value,role:$('uRole').value,full_name:$('uFull').value});flash('Utilisateur créé avec succès.');showPage('users')}catch(e){alert(e.message)}}
async function deleteUser(id){if(!canManageUsers())return;if(!confirm('Supprimer cet utilisateur ? Cette action est définitive.'))return;try{await api('/api/users/'+encodeURIComponent(id),'DELETE');flash('Utilisateur supprimé.');showPage('users')}catch(e){alert(e.message)}}
function editDeposit(a){$('modalBack').style.display='flex';$('modal').innerHTML=`<h2>Modifier le dépôt</h2><p class="muted">Vous pouvez corriger le montant et toutes les informations du dépôt.</p><div class="form-grid"><label>Montant<input id="edAmount" type="number" min="0" value="${esc(a.amount)}"></label><label>Date<input id="edDate" type="date" value="${esc((a.created_at||'').slice(0,10))}"></label><label>Service<input id="edDept" value="${esc(a.department||'Finance')}"></label><label>Référence / reçu<input id="edRef" value="${esc(a.reference||'')}"></label><label>Déposé par<input id="edBy" value="${esc(a.deposited_by||'')}"></label><label>Notes<textarea id="edNotes" rows="3">${esc(a.notes||'')}</textarea></label></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="updateDeposit(${a.id})">Enregistrer les modifications</button></div>`} 
async function updateDeposit(id){try{await api('/api/deposits/'+id+'/edit','POST',{amount:Number($('edAmount').value),department:$('edDept').value,reference:$('edRef').value,deposited_by:$('edBy').value,notes:$('edNotes').value,created_at:$('edDate').value+' 00:00:00'});closeModal();flash('Dépôt modifié avec succès.');deposits()}catch(e){alert(e.message)}}
function editSale(a){const gps=String(a.device_type||'').toUpperCase()==='GPS';const val=(v)=>esc(v??'');const listed=productItems.slice();if(a.product_id&&!listed.some(p=>String(p.id)===String(a.product_id))){listed.push({id:a.product_id,category:a.device_type,product_name:a.device_name||'Produit associé',selling_price:a.amount,stock_quantity:0,is_active:false})}const opts=`<option value="">Ancienne vente sans suivi de stock</option>${listed.map(p=>`<option value="${esc(p.id)}" ${String(p.id)===String(a.product_id)?'selected':''}>${esc(p.category)} — ${esc(p.product_name)} · Stock ${Number(p.stock_quantity||0)}${p.is_active?'':' · archivé'}</option>`).join('')}`;$('modalBack').style.display='flex';$('modal').innerHTML=`<h2>Modifier la vente</h2><p class="muted">Si vous associez un produit, la quantité et le stock seront contrôlés et ajustés.</p><div class="form-grid wide"><label class="wide-field">Produit du catalogue<select id="esProductId" onchange="editSaleProductChanged(true)">${opts}</select></label><label>Type d’appareil<input id="esType" value="${val(a.device_type)}" readonly></label><label>Quantité vendue<input id="esQuantity" type="number" min="1" value="${Number(a.quantity||1)}" oninput="editSaleProductChanged(true)"></label><label id="esAmountLabel">${gps?'Montant des appareils':'Montant à payer'}<input id="esAmount" type="number" min="0" value="${val(a.amount)}" readonly></label><label class="es-gps">Nom du client<input id="esClient" value="${val(a.client_name)}"></label><label class="es-gps">Numéro de téléphone<input id="esMobile" value="${val(a.mobile)}"></label><label class="es-gps">Numéro du SIM<input id="esSimNumber" value="${val(a.sim_number||a.device_phone)}"></label><label class="es-gps">Type du GPS<select id="esGpsType"><option value="Moto" ${a.gps_type==='Moto'?'selected':''}>Moto</option><option value="Voiture" ${a.gps_type==='Voiture'?'selected':''}>Voiture</option><option value="Camion" ${a.gps_type==='Camion'?'selected':''}>Camion</option></select></label><label class="es-gps">SIM + Activation<input id="esSimActivation" type="number" value="${Number(a.sim_cost||3000)}" readonly></label><label class="es-gps">Abonnement / mois<input id="esSubMonthly" type="number" value="3000" readonly></label><label class="es-gps">Nombre d’abonnement supplémentaire<input id="esMonths" type="number" min="0" value="${val(a.subscription_months||0)}" oninput="editSaleCalc()"></label><label class="es-gps">Total d’abonnement<input id="esTotalSub" type="number" value="${val(a.subscription)}" readonly></label><label class="es-gps">Total à payer<input id="esTotalAmount" type="number" value="${val(a.total_amount||a.amount)}" readonly></label><label class="es-gps">Abonnement effectué<select id="esSubDone"><option value="yes" ${a.subscription_done?'selected':''}>Oui</option><option value="no" ${!a.subscription_done?'selected':''}>Non</option></select></label><label class="es-gps wide-field">Adresse<textarea id="esAddress" rows="2">${val(a.address)}</textarea></label><label>Date et heure<input id="esDate" type="datetime-local" value="${val((a.sold_at||'').replace(' ','T').slice(0,16))}"></label><label class="wide-field">Note<textarea id="esNotes" rows="2">${val(a.notes)}</textarea></label></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="updateSale(${JSON.stringify(String(a.id))})">Enregistrer les modifications</button></div>`;editSaleProductChanged(false);editSaleCalc()}
function editSaleProductChanged(recalc=true){if(!$('esType'))return;const p=selectedProduct($('esProductId').value);const qty=Math.max(1,Number($('esQuantity').value)||1);const gps=String(p?.category||$('esType').value||'').toUpperCase()==='GPS';if(p){$('esType').value=p.category;if(recalc)$('esAmount').value=Number(p.selling_price||0)*qty;$('esAmount').readOnly=true;$('esAmountLabel').firstChild.textContent=gps?'Montant des appareils':'Montant à payer'}else{$('esAmount').readOnly=false;$('esAmountLabel').firstChild.textContent=gps?'Montant des appareils':'Montant à payer'}document.querySelectorAll('.es-gps').forEach(e=>e.style.display=gps?'flex':'none');const product=p; if(recalc&&product&&gps)editSaleCalc();else if(recalc&&product&&!gps)$('esTotalAmount').value=Number($('esAmount').value)||0}
function editSaleCalc(){if(!$('esMonths'))return;const qty=Math.max(1,Number($('esQuantity')?.value)||1);let months=Math.max(0,Number($('esMonths').value)||0);let base=Number($('esAmount').value)||0;$('esSimActivation').value=3000*qty;$('esTotalSub').value=3000*months*qty;$('esTotalAmount').value=base+(3000*qty)+(3000*months*qty)}
async function updateSale(id){const months=Math.max(0,Number($('esMonths')?.value)||0);const productId=$('esProductId')?.value||null;const qty=Math.max(1,Number($('esQuantity')?.value)||1);const product=productId?selectedProduct(productId):null;try{await api('/api/sales/'+id+'/edit','POST',{product_id:productId?Number(productId):null,quantity:qty,device_type:product?.category||$('esType').value,device_name:product?.product_name||'',client_name:$('esClient')?.value||'',mobile:$('esMobile')?.value||'',device_phone:'',sim_number:$('esSimNumber')?.value||'',gps_type:$('esGpsType')?.value||'',address:$('esAddress')?.value||'',setup_by:'',amount:Number($('esAmount').value)||0,subscription_months:months,subscription:Number($('esTotalSub')?.value)||0,subscription_done:$('esSubDone')?.value==='yes',sold_at:$('esDate').value,notes:$('esNotes').value});closeModal();flash('Vente modifiée. Le stock a été recalculé si nécessaire.');showPage('sales')}catch(e){alert(e.message)}}
async function deleteSale(id){if(!confirm('Supprimer cette vente ?'))return;try{await api('/api/sales/'+id,'DELETE');flash('Vente supprimée.');sales()}catch(e){alert(e.message)}}
async function deleteDeposit(id){if(!confirm('Supprimer ce dépôt ?'))return;try{await api('/api/deposits/'+id,'DELETE');flash('Dépôt supprimé.');deposits()}catch(e){alert(e.message)}}
