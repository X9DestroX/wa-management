<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>W-A Systeme de Gestion</title><style>:root{--navy:#12355b;--blue:#2563eb;--blue2:#eaf2ff;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e5e9f2;--green:#15803d;--red:#b91c1c;--shadow:0 10px 30px rgba(25,43,77,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}a{text-decoration:none;color:var(--blue)}button,input,select,textarea{font:inherit}.app-shell{display:flex;min-height:100vh}.sidebar{width:250px;background:#fff;border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 28px}.brand strong{display:block;font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-1px}.sidebar nav{display:grid;gap:5px}.nav-link{padding:12px 13px;border-radius:10px;color:#536071;font-weight:600}.nav-link:hover{background:#f0f5ff;color:var(--blue)}.side-bottom{margin-top:auto;border-top:1px solid var(--border);padding:18px 8px 0}.user-mini{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue2);color:var(--blue);display:grid;place-items:center;font-weight:700}.user-mini strong{font-size:13px;display:block}.user-mini small{font-size:11px;color:var(--muted)}.logout{display:block;margin-top:15px;color:#6b7280;font-size:13px}.main{margin-left:250px;width:calc(100% - 250px);padding:28px 34px 50px}.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}.eyebrow{font-size:10px;font-weight:800;color:#8b95a7;letter-spacing:.12em}.topbar h1{margin:4px 0 0;font-size:29px;letter-spacing:-.04em}.top-user{font-size:13px;color:#596579;display:flex;align-items:center;gap:8px}.network-pill{display:inline-flex;align-items:center;gap:5px;background:#ecfdf3;color:#166534;border:1px solid #bbf7d0;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:800}.network-dot{width:6px;height:6px;border-radius:50%;background:#16a34a}.network-pill.client{background:#eef5ff;color:#1d4ed8;border-color:#dbeafe}.network-pill.client .network-dot{background:#2563eb}.role-pill{display:inline-block;background:#eef2f7;color:#536071;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;margin-left:5px}.toolbar{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.date-filter label,.form-grid label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;color:#4c5869}.date-filter input,.form-grid input,.form-grid select,.form-grid textarea{border:1px solid var(--border);background:#fff;border-radius:9px;padding:10px 11px;outline:none;color:var(--text);font-weight:500}.form-grid textarea{resize:vertical}.date-filter input:focus,.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:#8bb2ff;box-shadow:0 0 0 3px #eaf2ff}.actions{display:flex;gap:9px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer;display:inline-block}.btn.primary{background:var(--blue);color:#fff}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--border)}.btn.full{width:100%;padding:12px}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat-card,.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.stat-card{padding:19px}.stat-card span,.stat-card small{display:block;color:var(--muted);font-size:12px}.stat-card strong{display:block;font-size:25px;margin:9px 0 4px;letter-spacing:-.03em}.split-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:15px;margin-top:15px}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.panel-head h2{margin:0;font-size:16px;letter-spacing:-.02em}.panel-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.device-overview{display:grid;grid-template-columns:1fr 1fr;gap:12px}.device-box{border:1px solid var(--border);border-radius:12px;padding:15px;display:flex;align-items:center;gap:12px}.device-box strong{display:block;font-size:22px}.device-box small{color:var(--muted)}.device-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800}.gps{background:#eaf2ff;color:#2563eb}.star{background:#eefaf2;color:#15803d}.big-number{font-size:34px;font-weight:800;margin:18px 0 5px;letter-spacing:-.04em}.muted{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:12px 9px;border-top:1px solid var(--border);white-space:nowrap}th{color:#8993a3;font-size:10px;text-transform:uppercase;letter-spacing:.07em}td{color:#3e4858}.table-sub{display:block;color:#9aa3b2;margin-top:3px}.tag{font-size:10px;font-weight:800;border-radius:999px;background:#f0f4f9;padding:4px 7px;color:#5b6676}.empty{text-align:center;color:#9aa3b2;padding:25px}.page-grid{display:grid;grid-template-columns:minmax(300px,.75fr) minmax(500px,1.6fr);gap:15px}.form-panel{align-self:start}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid.wide{grid-template-columns:repeat(3,1fr)}.wide-field{grid-column:1/-1}.form-actions{grid-column:1/-1;padding-top:4px}.check-label{display:flex!important;flex-direction:row!important;align-items:center;gap:9px!important;padding-top:27px}.check-label input{width:17px;height:17px}.icon-btn{border:0;background:none;cursor:pointer;font-size:11px}.danger{color:var(--red)}.ok-dot{color:var(--green);font-weight:800}.alerts{display:grid;gap:8px;margin-bottom:15px}.alert{padding:11px 13px;border-radius:9px;font-size:13px}.alert.success{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}.alert.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.login-page{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f6f9ff,#eef3f9)}.login-card{width:min(430px,calc(100% - 30px));background:#fff;border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:0 20px 50px rgba(25,43,77,.1)}.login-brand{padding:0 0 25px}.login-copy h1{font-size:27px;margin:0 0 7px;letter-spacing:-.04em}.login-copy p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 22px}.login-card form{display:grid;gap:15px}.login-card label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;color:#4c5869}.login-card input{border:1px solid var(--border);border-radius:9px;padding:12px}.demo-box{margin-top:20px;background:#f7f9fc;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:11px;color:#687384;display:grid;gap:4px}.demo-box strong{color:#354052}.demo-box small{margin-top:3px;color:#9aa3b2}.modalback{display:none;position:fixed;inset:0;background:rgba(20,32,50,.25);z-index:20;align-items:center;justify-content:center;padding:20px}.modal{width:min(620px,100%);background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(25,43,77,.18)}.modal h2{margin:0 0 6px}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
@media(max-width:1000px){.stats-grid{grid-template-columns:repeat(2,1fr)}.split-grid,.page-grid{grid-template-columns:1fr}.form-grid.wide{grid-template-columns:1fr 1fr}}@media(max-width:700px){.sidebar{width:70px;padding:18px 10px}.sidebar .brand strong,.sidebar .brand small,.nav-link{font-size:0}.nav-link:before{content:'•';font-size:20px}.user-mini div:not(.avatar),.logout{display:none}.main{margin-left:70px;width:calc(100% - 70px);padding:20px}.top-user{display:none}.toolbar{align-items:stretch;gap:10px;flex-direction:column}.stats-grid{grid-template-columns:1fr 1fr}.form-grid,.form-grid.wide{grid-template-columns:1fr}.wide-field,.form-actions{grid-column:1}.check-label{padding-top:0!important}}@media(max-width:430px){.stats-grid{grid-template-columns:1fr}.device-overview{grid-template-columns:1fr}}
@media print{body{background:#fff!important;color:#111}.sidebar,.topbar,.toolbar,.no-print,#alerts,.modalback{display:none!important}.main{margin:0!important;width:100%!important;padding:0!important}.app-shell{display:block!important}.panel,.stat-card{box-shadow:none!important;border-color:#ccc!important}.panel{break-inside:avoid;margin-bottom:8px;padding:10px!important}.table-wrap{overflow:visible!important}table{font-size:9px!important}th,td{white-space:normal!important;padding:5px!important}.report-print-only{display:block!important}.report-actions{display:none!important}.stats-grid{grid-template-columns:repeat(3,1fr)!important}.split-grid{grid-template-columns:1fr!important}}.report-controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.report-controls label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#4c5869}.report-controls input,.report-controls select{border:1px solid var(--border);background:white;border-radius:9px;padding:10px;color:var(--text)}.report-summary{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:12px;margin:14px 0}.report-actions{display:flex;gap:8px;flex-wrap:wrap}.expense-page{display:grid;gap:16px}.report-print-only{display:none}@media(max-width:800px){.report-summary{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="loginView"></div>
<div id="appView" style="display:none"></div>
<div id="modalBack" class="modalback"><div id="modal" class="modal"></div></div>
<script>
let token='', user=null, currentDate=new Date().toISOString().slice(0,10), currentPage='dashboard';
const $=id=>document.getElementById(id);
function money(v){return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' FCFA'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(path,method='GET',body=null){const o={method,headers:{'Content-Type':'application/json'}};if(token)o.headers.Authorization='Bearer '+token;if(body)o.body=JSON.stringify(body);const r=await fetch(path,o);const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'La requête a échoué');return x}
let cloudMode=false;
function loginScreen(msg=''){$('loginView').innerHTML=`<div class="login-page"><div class="login-card">
<div class="brand login-brand"><div class="brand-mark">EA</div><div><strong>W-A Systeme de Gestion</strong><small>Opérations de l’entreprise</small></div></div>
<div class="login-copy"><h1>Bienvenue</h1><p>Connectez-vous pour gérer les opérations quotidiennes, les dépôts financiers et les ventes d’appareils.</p></div>
${msg?`<div class="alert error">${esc(msg)}</div>`:''}
<form onsubmit="event.preventDefault();login()"><label>E-mail (cloud) / nom d’utilisateur (LAN)<input id="username" autocomplete="username" required autofocus></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary full" type="submit">Se connecter</button></form>
</div></div>`}
loginScreen();
async function login(){try{const identity=$('username').value.trim();let x=await api('/api/login','POST',{username:identity,email:identity,password:$('password').value});token=x.token;user=x.user;renderApp();await loadNetworkStatus();showPage('dashboard')}catch(e){loginScreen(e.message)}}
async function loadNetworkStatus(){try{const n=await api('/api/network');const el=$('networkStatus');if(!el)return;cloudMode=n.role==='cloud';const client=n.role==='client';el.className='network-pill'+((client||cloudMode)?' client':'');el.innerHTML=`<span class="network-dot"></span>${cloudMode?'Cloud connecté':(client?'LAN connecté':'Serveur LAN')}`;el.title=cloudMode?'Données centralisées dans Supabase':(client?`Connecté à ${n.server}:${n.port}`:`Serveur : ${n.local_ip}:${n.port}`)}catch(e){const el=$('networkStatus');if(el){el.className='network-pill client';el.innerHTML='<span class="network-dot"></span>Hors ligne'}}}
function renderApp(){ $('loginView').style.display='none'; $('appView').style.display='block'; $('appView').innerHTML=`<div class="app-shell">
<aside class="sidebar"><div class="brand"><div class="brand-mark">EA</div><div><strong>W-A Systeme de Gestion</strong><small>Système de gestion</small></div></div>
<nav><a id="nav-dashboard" class="nav-link" onclick="showPage('dashboard')">Tableau de bord</a><a id="nav-deposits" class="nav-link" onclick="showPage('deposits')">Finance / Dépôts</a><a id="nav-sales" class="nav-link" onclick="showPage('sales')">Ventes d’appareils</a><a id="nav-reports" class="nav-link" onclick="showPage('reports')">Rapports</a><a id="nav-users" class="nav-link" onclick="showPage('users')">Utilisateurs et accès</a>${canViewAudit()?`<a id="nav-audit" class="nav-link" onclick="showPage('audit')">Journaux d’activité</a>`:''}</nav>
<div class="side-bottom"><div class="user-mini"><div class="avatar">${esc((user.full_name||user.username)[0].toUpperCase())}</div><div><strong>${esc(user.full_name||user.username)}</strong><small>${esc(user.role)}</small></div></div><a class="logout" onclick="logout()">Se déconnecter</a></div></aside>
<main class="main"><header class="topbar"><div><span class="eyebrow">COMPANY OPERATIONS</span><h1 id="heading">Tableau de bord</h1></div><div class="top-user"><span id="networkStatus" class="network-pill"><span class="network-dot"></span>Serveur LAN</span>${esc(user.full_name||user.username)} <span class="role-pill">${esc(user.role)}</span></div></header><div id="alerts"></div><div id="content"></div></main></div>`}
function activate(p){['dashboard','deposits','sales','reports','users','audit'].forEach(x=>$('nav-'+x)?.classList.toggle('active',x===p));currentPage=p}
function isSystemSuperadmin(u=user){return String(u?.username||'').toLowerCase()==='destrox'&&u?.role==='Superadmin'}
function canManageUsers(u=user){return u?.role==='Administrateur'||isSystemSuperadmin(u)}
function canViewAudit(u=user){return u?.role==='Administrateur'||isSystemSuperadmin(u)}
function isProtectedSuperadminAccount(a){return String(a?.username||'').toLowerCase()==='destrox'||a?.role==='Superadmin'}
async function logout(){try{if(token)await api('/api/logout','POST',{})}catch(e){}token='';user=null;$('appView').style.display='none';$('loginView').style.display='block';loginScreen()}
async function showPage(p){if(p==='audit'&&!canViewAudit()){flash('Accès réservé à l’administrateur.','error');return}currentPage=p;activate(p);$('heading').textContent=({'dashboard':'Tableau de bord','deposits':'Finance et dépôts','sales':'Ventes d’appareils','reports':'Rapports','users':'Utilisateurs et accès','audit':'Journaux d’activité'})[p]||'Tableau de bord';try{if(p==='dashboard')await dashboard();if(p==='deposits')await deposits();if(p==='sales')await sales();if(p==='reports')await reports();if(p==='users')await users();if(p==='audit')await auditLogs()}catch(e){$('content').innerHTML=`<div class="alert error">${esc(e.message)}</div>`}}
function flash(msg,kind='success'){$('alerts').innerHTML=`<div class="alert ${kind}">${esc(msg)}</div>`;setTimeout(()=>{if($('alerts'))$('alerts').innerHTML=''},3500)}
async function dashboard(){let d=await api('/api/dashboard?date='+currentDate);$('content').innerHTML=`<section class="toolbar"><form class="date-filter" onsubmit="event.preventDefault()"><label>Date des opérations<input type="date" value="${currentDate}" onchange="currentDate=this.value;dashboard()"></label></form><div class="actions"><button class="btn secondary" onclick="openDeposit()">+ Dépôt</button><button class="btn primary" onclick="openSale()">+ Enregistrer une vente</button></div></section>
<div class="stats-grid"><div class="stat-card"><span>Déposé en finance</span><strong>${money(d.deposits)}</strong><small>Jour sélectionné</small></div><div class="stat-card"><span>Chiffre d’affaires appareils</span><strong>${money(d.revenue)}</strong><small>GPS + Starlink</small></div><div class="stat-card"><span>Abonnements</span><strong>${money(d.subscriptions)}</strong><small>Abonnements enregistrés</small></div><div class="stat-card"><span>Dépenses enregistrées</span><strong>${money(d.expenses)}</strong><small>Charges entreprise et charges liées aux ventes</small></div></div>
<div class="split-grid"><section class="panel"><div class="panel-head"><div><h2>Vue d’ensemble des ventes</h2><p>Appareils enregistrés le ${currentDate}</p></div></div><div class="device-overview"><div class="device-box"><span class="device-icon gps">G</span><div><strong>${d.gps}</strong><small>Appareils GPS</small></div></div><div class="device-box"><span class="device-icon star">S</span><div><strong>${d.starlink}</strong><small>Appareils Starlink</small></div></div></div></section>
<section class="panel"><div class="panel-head"><div><h2>Position du jour</h2><p>Chiffre d’affaires moins les dépenses enregistrées</p></div></div><div class="big-number">${money(Number(d.revenue)-Number(d.expenses))}</div><div class="muted">Valeur opérationnelle avant les autres charges de l’entreprise</div></section></div>
<div class="split-grid"><section class="panel"><div class="panel-head"><h2>Ventes récentes d’appareils</h2><a onclick="showPage('sales')">Voir tout</a></div>${salesTable(d.recent||[],true)}</section><section class="panel"><div class="panel-head"><h2>Dépôts récents</h2><a onclick="showPage('deposits')">Voir tout</a></div>${depositTable(d.recent_deposits||[])}</section></div>`}
function salesTable(a,compact=false){
if(!a.length)return '<div class="empty">Aucune vente enregistrée.</div>';
if(compact)return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Client</th><th>Type GPS</th><th>Montant</th><th>Total abonnement</th><th>Total à payer</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc((x.sold_at||'').replace('T',' '))}</td><td>${esc(x.client_name||'-')}</td><td>${esc(x.gps_type||x.device_type||'-')}</td><td><strong>${money(x.amount)}</strong></td><td>${money(x.subscription)}</td><td><strong>${money(x.total_amount||x.amount)}</strong></td></tr>`).join('')}</tbody></table></div>`;
const gpsSales=a.filter(x=>String(x.device_type||'').toUpperCase()==='GPS');
const starlinkSales=a.filter(x=>String(x.device_type||'').toUpperCase()==='STARLINK');
const otherSales=a.filter(x=>!['GPS','STARLINK'].includes(String(x.device_type||'').toUpperCase()));
const gpsTable=rows=>`<div class="table-wrap"><table><thead><tr><th>Date et heure</th><th>Client</th><th>Téléphone</th><th>N° SIM</th><th>Type GPS</th><th>Montant</th><th>SIM + activation</th><th>Abonnement / mois</th><th>Nombre</th><th>Total abonnement</th><th>Total à payer</th><th>Abonnement effectué</th><th>Adresse</th><th>Note</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc((x.sold_at||'').replace('T',' '))}</td><td>${esc(x.client_name||'-')}</td><td>${esc(x.mobile||'-')}</td><td>${esc(x.sim_number||x.device_phone||'-')}</td><td>${esc(x.gps_type||'-')}</td><td><strong>${money(x.amount)}</strong></td><td>${money(x.sim_cost||3000)}</td><td>${money(x.billed_subscription_monthly||3000)}</td><td>${x.subscription_months??0}</td><td>${money(x.subscription)}</td><td><strong>${money(x.total_amount||x.amount)}</strong></td><td>${x.subscription_done?'Oui':'Non'}</td><td>${esc(x.address||'-')}</td><td>${esc(x.notes||'-')}</td><td><button class="icon-btn" onclick='editSale(${JSON.stringify(x)})'>Modifier</button> <button class="icon-btn danger" onclick="deleteSale(${x.id})">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`;
const starlinkTable=rows=>`<div class="table-wrap"><table><thead><tr><th>Type d’appareil</th><th>Montant à payer</th><th>Date et heure</th><th>Note</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td>Starlink</td><td><strong>${money(x.amount)}</strong></td><td>${esc((x.sold_at||'').replace('T',' '))}</td><td>${esc(x.notes||'-')}</td><td><button class="icon-btn" onclick='editSale(${JSON.stringify(x)})'>Modifier</button> <button class="icon-btn danger" onclick="deleteSale(${x.id})">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`;
const otherTable=rows=>`<div class="table-wrap"><table><thead><tr><th>Type d’appareil</th><th>Montant à payer</th><th>Date et heure</th><th>Note</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.device_type||'-')}</td><td><strong>${money(x.amount)}</strong></td><td>${esc((x.sold_at||'').replace('T',' '))}</td><td>${esc(x.notes||'-')}</td><td><button class="icon-btn" onclick='editSale(${JSON.stringify(x)})'>Modifier</button> <button class="icon-btn danger" onclick="deleteSale(${x.id})">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`;
return `${gpsSales.length?`<section style="margin-bottom:24px"><div class="panel-head"><h3 style="margin:0;font-size:14px">Ventes GPS</h3></div>${gpsTable(gpsSales)}</section>`:''}${starlinkSales.length?`<section style="margin-bottom:24px"><div class="panel-head"><h3 style="margin:0;font-size:14px">Ventes Starlink</h3></div>${starlinkTable(starlinkSales)}</section>`:''}${otherSales.length?`<section style="margin-bottom:24px"><div class="panel-head"><h3 style="margin:0;font-size:14px">Autres appareils</h3></div>${otherTable(otherSales)}</section>`:''}`;
}
function depositTable(a){if(!a.length)return '<div class="empty">Aucun dépôt enregistré.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Référence</th><th>Montant</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc((x.created_at||'').replace('T',' '))}</td><td>${esc(x.reference||'Dépôt financier')}</td><td><strong>${money(x.amount)}</strong></td></tr>`).join('')}</tbody></table></div>`}

function renderReport(r,period,date){window.reportPeriod=period;window.reportDate=date;const s=r.summary;const salesRows=r.sales||[];const depositRows=r.deposits||[];const expenseRows=r.expenses||[];const moneyCell=v=>`<strong>${money(v)}</strong>`;$('content').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Rapports hebdomadaires et mensuels</h2><p>Analyse consolidée des ventes, abonnements, dépôts et dépenses enregistrées dans le cloud.</p></div></div><div class="report-controls no-print"><label>Période<select id="reportPeriod" onchange="loadReport()"><option value="weekly" ${period==='weekly'?'selected':''}>Hebdomadaire (lundi à dimanche)</option><option value="monthly" ${period==='monthly'?'selected':''}>Mensuel (mois civil)</option></select></label><label>Date de référence<input id="reportDate" type="date" value="${esc(date)}" onchange="loadReport()"></label><div class="report-actions"><button class="btn primary" onclick="exportReportPDF()">Exporter le rapport en PDF</button><button class="btn secondary" onclick="window.print()">Imprimer / Enregistrer en PDF</button></div></div><div class="report-print-only"><h2>${esc(r.label)}</h2><p>Du ${esc(r.start_date)} au ${esc(r.end_date)}</p></div><p class="muted">Période : ${esc(r.start_date)} au ${esc(r.end_date)}</p><div class="report-summary"><div class="stat-card"><span>Chiffre d’affaires</span><strong>${money(s.revenue)}</strong><small>${s.sales_count} vente(s)</small></div><div class="stat-card"><span>Abonnements encaissés</span><strong>${money(s.subscriptions)}</strong><small>Montants d’abonnements liés aux ventes</small></div><div class="stat-card"><span>Dépôts financiers</span><strong>${money(s.deposits)}</strong><small>${s.deposits_count} dépôt(s)</small></div><div class="stat-card"><span>Dépenses entreprise</span><strong>${money(s.company_expenses)}</strong><small>${s.expenses_count} dépense(s)</small></div><div class="stat-card"><span>Dépenses enregistrées sur les ventes</span><strong>${money(s.sale_expenses)}</strong><small>Anciennes charges liées aux ventes</small></div><div class="stat-card"><span>Position opérationnelle</span><strong>${money(s.net_operating)}</strong><small>Chiffre d’affaires moins toutes les dépenses enregistrées</small></div></div><section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><h2>Résumé des appareils vendus</h2><p>GPS : ${s.gps_count} · Starlink : ${s.starlink_count}</p></div></div>${reportSalesTable(salesRows)}</section><section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><h2>Dépôts financiers</h2><p>Total : ${money(s.deposits)}</p></div></div>${depositHistoryReadOnly(depositRows)}</section><section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><h2>Dépenses de l’entreprise</h2><p>Total : ${money(s.company_expenses)}</p></div></div>${reportExpenseTable(expenseRows)}</section><section class="panel"><div class="panel-head"><div><h2>Dépenses liées aux ventes</h2><p>Total : ${money(s.sale_expenses)}</p></div></div>${reportSaleExpenseTable(salesRows)}</section></section>`}
async function loadReport(){const period=$('reportPeriod').value;const date=$('reportDate').value||currentDate;try{const r=await api('/api/reports?period='+encodeURIComponent(period)+'&date='+encodeURIComponent(date));renderReport(r,period,date)}catch(e){alert(e.message)}}
async function exportReportPDF(){const period=$('reportPeriod')?.value||window.reportPeriod||'weekly';const date=$('reportDate')?.value||window.reportDate||currentDate;try{const response=await fetch('/api/reports/pdf?period='+encodeURIComponent(period)+'&date='+encodeURIComponent(date),{headers:{Authorization:'Bearer '+token}});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok){throw new Error(result.error||'Impossible d’enregistrer le PDF.')}flash('PDF enregistré dans Téléchargements.');alert('Rapport PDF enregistré avec succès.\n\nFichier : '+result.filename+'\n\nEmplacement complet :\n'+result.saved_path+'\n\nVous pouvez copier ce chemin dans la barre d’adresse de l’Explorateur de fichiers Windows.')}catch(e){alert(e.message)}}
function reportSalesTable(rows){if(!rows.length)return '<div class="empty">Aucune vente sur cette période.</div>';const gps=rows.filter(x=>String(x.device_type).toUpperCase()==='GPS');const star=rows.filter(x=>String(x.device_type).toUpperCase()==='STARLINK');const other=rows.filter(x=>!['GPS','STARLINK'].includes(String(x.device_type).toUpperCase()));const t=(items,headers,cells)=>!items.length?'':`<h3>${headers[0]}</h3><div class="table-wrap"><table><thead><tr>${headers.slice(1).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${items.map(x=>`<tr>${cells(x).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;return `${t(gps,['Ventes GPS','Date','Client','Téléphone','N° SIM','Type GPS','Montant','Abonnement','Total à payer','Adresse','Note'],x=>[esc((x.sold_at||'').replace('T',' ').slice(0,16)),esc(x.client_name||'-'),esc(x.mobile||'-'),esc(x.sim_number||x.device_phone||'-'),esc(x.gps_type||'-'),money(x.amount),money(x.subscription),money(x.total_amount??x.amount),esc(x.address||'-'),esc(x.notes||'-')])}${t(star,['Ventes Starlink','Date','Type d’appareil','Montant à payer','Note'],x=>[esc((x.sold_at||'').replace('T',' ').slice(0,16)),'Starlink',money(x.amount),esc(x.notes||'-')])}${t(other,['Autres ventes','Date','Type','Total à payer','Note'],x=>[esc((x.sold_at||'').replace('T',' ').slice(0,16)),esc(x.device_type||'-'),money(x.total_amount??x.amount),esc(x.notes||'-')])}`}
function depositHistoryReadOnly(rows){if(!rows.length)return '<div class="empty">Aucun dépôt sur cette période.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Montant</th><th>Service</th><th>Référence</th><th>Déposé par</th><th>Notes</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc((x.created_at||'').replace('T',' ').slice(0,16))}</td><td>${money(x.amount)}</td><td>${esc(x.department||'Finance')}</td><td>${esc(x.reference||'-')}</td><td>${esc(x.deposited_by||'-')}</td><td>${esc(x.notes||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function reportExpenseTable(rows){if(!rows.length)return '<div class="empty">Aucune dépense entreprise sur cette période.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Montant</th><th>Catégorie</th><th>Bénéficiaire</th><th>Mode de paiement</th><th>Référence</th><th>Description / notes</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc((x.incurred_at||'').replace('T',' ').slice(0,16))}</td><td>${money(x.amount)}</td><td>${esc(x.category||'Autre')}</td><td>${esc(x.paid_to||'-')}</td><td>${esc(x.payment_method||'-')}</td><td>${esc(x.reference||'-')}</td><td>${esc(x.description||x.notes||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function reportSaleExpenseTable(rows){const items=rows.filter(x=>Number(x.expenses||0)!==0);if(!items.length)return '<div class="empty">Aucune dépense associée aux ventes sur cette période.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Client / appareil</th><th>Dépenses</th><th>Note</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc((x.sold_at||'').replace('T',' ').slice(0,16))}</td><td>${esc(x.device_type||'-')}</td><td>${esc(x.client_name||x.device_name||'-')}</td><td>${money(x.expenses)}</td><td>${esc(x.notes||'-')}</td></tr>`).join('')}</tbody></table></div>`}

function auditOperationLabel(a){const op=String(a.operation||'').toUpperCase();const act=String(a.action||'');if(/^(Ajout|Modification|Suppression|Connexion|Déconnexion)/i.test(act))return act;if(op==='INSERT')return 'Ajout';if(op==='UPDATE')return 'Modification';if(op==='DELETE')return 'Suppression';if(op==='LOGIN')return 'Connexion réussie';if(op==='LOGOUT')return 'Déconnexion';if(act.toLowerCase().includes('create'))return 'Création utilisateur';if(act.toLowerCase().includes('update'))return 'Modification utilisateur';if(act.toLowerCase().includes('delete'))return 'Suppression utilisateur';if(act.toLowerCase().includes('connexion'))return act;return act||'Action'}
function auditEntityLabel(a){const t=String(a.entity_table||'').toLowerCase();const details=typeof a.details==='string'?(()=>{try{return JSON.parse(a.details)}catch{return {}}})():(a.details||{});const table=t||details.table||((String(a.action||'').includes('users')||String(a.action||'').includes('utilisateur'))?'profiles':'');const names={sales:'Vente',deposits:'Dépôt',expenses:'Dépense',profiles:'Utilisateur',auth:'Session'};const id=a.entity_id||details.record_id||details.target_id||details.id||'';return (names[table]||table||'—')+(id?' #'+id:'')}
function auditDetailText(a){let details=a.details;if(typeof details==='string'){try{details=JSON.parse(details)}catch{}}const hasSnapshots=a.before_data||a.after_data;const payload=hasSnapshots?{avant:a.before_data||null,après:a.after_data||null}:(details||{});let s='';try{s=JSON.stringify(payload,null,2)}catch{s=String(payload)}return s&&s!=='{}'?s:'Aucun détail supplémentaire.'}
async function auditLogs(){if(!canViewAudit())throw new Error('La consultation des journaux est réservée à l’administrateur ou au Superadmin.');const x=await api('/api/audit');window.auditItems=x.items||[];$('content').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Journaux d’activité</h2><p>Connexions, ajouts, modifications et suppressions. Les événements sont horodatés et associés au compte employé.</p></div><button class="btn secondary" onclick="auditLogs()">Actualiser</button></div><div class="report-controls no-print" style="margin-bottom:14px"><label>Rechercher<input id="auditSearch" placeholder="Nom, e-mail, action, référence…" oninput="filterAuditLogs()"></label><label>Type d’événement<select id="auditType" onchange="filterAuditLogs()"><option value="">Tous les événements</option><option value="LOGIN">Connexion</option><option value="LOGOUT">Déconnexion</option><option value="INSERT">Ajout</option><option value="UPDATE">Modification</option><option value="DELETE">Suppression</option></select></label></div><div id="auditTable"></div></section>`;filterAuditLogs()}
function filterAuditLogs(){const all=window.auditItems||[];const q=($('auditSearch')?.value||'').toLowerCase();const typ=$('auditType')?.value||'';const rows=all.filter(a=>{const search=[a.username,a.actor_email,a.actor_role,a.action,a.entity_table,a.entity_id,a.details,a.before_data,a.after_data].map(v=>typeof v==='object'?JSON.stringify(v):String(v||'')).join(' ').toLowerCase();const op=String(a.operation||'').toUpperCase();return (!q||search.includes(q))&&(!typ||op===typ||(typ==='INSERT'&&String(a.action||'').toLowerCase().includes('create'))||(typ==='UPDATE'&&String(a.action||'').toLowerCase().includes('update'))||(typ==='DELETE'&&String(a.action||'').toLowerCase().includes('delete'))||(typ==='LOGIN'&&String(a.action||'').toLowerCase().includes('connexion'))||(typ==='LOGOUT'&&String(a.action||'').toLowerCase().includes('déconnexion')))});const target=$('auditTable');if(!target)return;if(!rows.length){target.innerHTML='<div class="empty">Aucun événement ne correspond aux filtres.</div>';return}target.innerHTML=`<div class="muted" style="margin-bottom:8px">${rows.length} événement(s) affiché(s), maximum 500 plus récents.</div><div class="table-wrap"><table><thead><tr><th>Date et heure</th><th>Employé</th><th>Rôle</th><th>Action</th><th>Élément</th><th>Détails</th></tr></thead><tbody>${rows.map(a=>{const dt=String(a.created_at||'').replace('T',' ').replace('Z',' UTC').slice(0,25);const role=a.actor_role||'';return `<tr><td>${esc(dt||'-')}</td><td>${esc(a.actor_email||a.username||'-')}</td><td>${esc(role||'-')}</td><td>${esc(auditOperationLabel(a))}</td><td>${esc(auditEntityLabel(a))}</td><td><details><summary>Voir les détails</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;max-width:440px;max-height:300px;overflow:auto;background:#f8fafc;padding:10px;border-radius:8px;font-size:11px">${esc(auditDetailText(a))}</pre></details></td></tr>`}).join('')}</tbody></table></div>`}

async function users(){let x=await api('/api/users');let manager=canManageUsers(),superadmin=isSystemSuperadmin();$('content').innerHTML=`<div class="page-grid">${manager?`<section class="panel form-panel"><div class="panel-head"><div><h2>Créer un utilisateur</h2><p>Ajouter un compte RH, Gestionnaire ou Administrateur. Le compte Superadmin destrox est réservé et ne peut pas être créé ici.</p></div></div><div class="form-grid">${cloudMode?'<label>Adresse e-mail<input id="uEmail" type="email" required></label>':''}<label>Nom complet<input id="uFull"></label><label>Nom d’utilisateur<input id="uName" required></label><label>Mot de passe<input id="uPass" type="password" minlength="${cloudMode?12:1}" required></label><label>Rôle<select id="uRole"><option>RH</option><option>Gestionnaire</option><option>Administrateur</option></select></label><div class="form-actions"><button class="btn primary" onclick="saveUser()">Créer l’utilisateur</button></div></div></section>`:''}<section class="panel"><div class="panel-head"><div><h2>Comptes utilisateurs</h2><p>${superadmin?'Superadmin : gestion de tous les comptes. Le compte destrox reste protégé contre la suppression et le changement de rôle/nom.':manager?'Vous pouvez gérer les comptes ordinaires. Le compte Superadmin destrox est protégé.':'Consultation uniquement : seuls les administrateurs et le Superadmin peuvent gérer les utilisateurs.'}</p></div></div><div class="table-wrap"><table><thead><tr><th>Nom</th><th>Nom d’utilisateur</th>${cloudMode&&manager?'<th>E-mail</th>':''}<th>Rôle</th><th>Créé le</th>${manager?'<th>Actions</th>':''}</tr></thead><tbody>${x.items.map(a=>{const protectedAccount=isProtectedSuperadminAccount(a);const mayEdit=manager&&(!protectedAccount||superadmin);const mayDelete=manager&&!protectedAccount&&String(a.id)!==String(user.id);return `<tr><td>${esc(a.full_name||'-')}</td><td>${esc(a.username)}</td>${cloudMode&&manager?`<td>${esc(a.email||'-')}</td>`:''}<td><span class="role-pill">${esc(a.role)}</span></td><td>${esc(a.created_at||'-')}</td>${manager?`<td>${mayEdit?`<button class="icon-btn" onclick='editUser(${JSON.stringify(a)})'>Modifier</button>`:''} ${mayDelete?`<button class="icon-btn danger" onclick='deleteUser(${JSON.stringify(String(a.id))})'>Supprimer</button>`:''}${protectedAccount&&!superadmin?'<span class="muted">Compte protégé</span>':''}</td>`:''}</tr>`}).join('')}</tbody></table></div></section></div>`}
function editUser(a){if(!canManageUsers())return;const superadmin=isSystemSuperadmin();const protectedAccount=isProtectedSuperadminAccount(a);if(protectedAccount&&!superadmin)return;const fixedProtected=protectedAccount; $('modalBack').style.display='flex';$('modal').innerHTML=`<h2>Modifier l’utilisateur</h2><p class="muted">${fixedProtected?'Compte système protégé : nom d’utilisateur et rôle sont fixes.':'Gestion des comptes réservée à l’administrateur ou au Superadmin.'}</p><div class="form-grid">${cloudMode?`<label>Adresse e-mail<input id="eEmail" type="email" value="${esc(a.email||'')}"></label>`:''}<label>Nom complet<input id="eFull" value="${esc(a.full_name||'')}"></label><label>Nom d’utilisateur<input id="eName" value="${esc(a.username)}" ${fixedProtected?'readonly':''}></label><label>Nouveau mot de passe<input id="ePass" type="password" minlength="${cloudMode?12:1}" placeholder="Laisser vide pour conserver le mot de passe actuel"></label>${fixedProtected?`<label>Rôle<select id="eRole" disabled><option selected>Superadmin</option></select></label>`:`<label>Rôle<select id="eRole"><option ${a.role==='RH'?'selected':''}>RH</option><option ${a.role==='Gestionnaire'?'selected':''}>Gestionnaire</option><option ${a.role==='Administrateur'?'selected':''}>Administrateur</option></select></label>`}</div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Annuler</button><button class="btn primary" onclick='updateUser(${JSON.stringify(String(a.id))})'>Enregistrer les modifications</button></div>`}
async function updateUser(id){if(!canManageUsers())return;try{await api('/api/users/'+encodeURIComponent(id)+'/edit','POST',{email:$('eEmail')?.value||'',username:$('eName').value,full_name:$('eFull').value,password:$('ePass').value,role:$('eRole').value});closeModal();flash('Compte utilisateur modifié avec succès.');showPage('users')}catch(e){alert(e.message)}}
async function saveUser(){if(!canManageUsers())return;try{await api('/api/users','POST',{email:$('uEmail')?.value||'',username:$('uName').value,password:$('uPass').value,role:$('uRole').value,full_name:$('uFull').value});flash('Utilisateur créé avec succès.');showPage('users')}catch(e){alert(e.message)}}
async function deleteUser(id){if(!canManageUsers())return;if(!confirm('Supprimer cet utilisateur ? Cette action est définitive.'))return;try{await api('/api/users/'+encodeURIComponent(id),'DELETE');flash('Utilisateur supprimé.');showPage('users')}catch(e){alert(e.message)}}
function editDeposit(a){$('modalBack').style.display='flex';$('modal').innerHTML=`<h2>Modifier le dépôt</h2><p class="muted">Vous pouvez corriger le montant et toutes les informations du dépôt.</p><div class="form-grid"><label>Montant<input id="edAmount" type="number" min="0" value="${esc(a.amount)}"></label><label>Date<input id="edDate" type="date" value="${esc((a.created_at||'').slice(0,10))}"></label><label>Service<input id="edDept" value="${esc(a.department||'Finance')}"></label><label>Référence / reçu<input id="edRef" value="${esc(a.reference||'')}"></label><label>Déposé par<input id="edBy" value="${esc(a.deposited_by||'')}"></label><label>Notes<textarea id="edNotes" rows="3">${esc(a.notes||'')}</textarea></label></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="updateDeposit(${a.id})">Enregistrer les modifications</button></div>`} 
async function updateDeposit(id){try{await api('/api/deposits/'+id+'/edit','POST',{amount:Number($('edAmount').value),department:$('edDept').value,reference:$('edRef').value,deposited_by:$('edBy').value,notes:$('edNotes').value,created_at:$('edDate').value+' 00:00:00'});closeModal();flash('Dépôt modifié avec succès.');deposits()}catch(e){alert(e.message)}}
function editSale(a){const gps=a.device_type==='GPS';const val=(v)=>esc(v??'');$('modalBack').style.display='flex';$('modal').innerHTML=`<h2>Modifier la vente</h2><p class="muted">Modifiez les informations du client, du GPS, du montant ou de l’abonnement.</p><div class="form-grid wide"><label>Type d’appareil<select id="esType" onchange="editSaleTypeChanged()"><option value="GPS" ${gps?'selected':''}>GPS</option><option value="Starlink" ${!gps?'selected':''}>Starlink</option></select></label><label class="es-gps">Nom du client<input id="esClient" value="${val(a.client_name)}"></label><label class="es-gps">Numéro de téléphone<input id="esMobile" value="${val(a.mobile)}"></label><label id="esAmountLabel">${gps?'Montant':'Montant à payer'}<input id="esAmount" type="number" min="0" value="${val(a.amount)}" oninput="editSaleCalc()"></label><label class="es-gps">Numéro du SIM<input id="esSimNumber" value="${val(a.sim_number||a.device_phone)}"></label><label class="es-gps">Type du GPS<select id="esGpsType"><option ${a.gps_type==='Moto'?'selected':''}>Moto</option><option ${a.gps_type==='Voiture'?'selected':''}>Voiture</option><option ${a.gps_type==='Camion'?'selected':''}>Camion</option></select></label><label class="es-gps">SIM + Activation<input id="esSimActivation" type="number" value="3000" readonly></label><label class="es-gps">Abonnement / mois<input id="esSubMonthly" type="number" value="3000" readonly></label><label class="es-gps">Nombre d’abonnement<input id="esMonths" type="number" min="0" value="${val(a.subscription_months||0)}" oninput="editSaleCalc()"></label><label class="es-gps">Total d’abonnement<input id="esTotalSub" type="number" value="${val(a.subscription)}" readonly></label><label class="es-gps">Total à payer<input id="esTotalAmount" type="number" value="${val(a.total_amount||a.amount)}" readonly></label><label class="es-gps">Abonnement effectué<select id="esSubDone"><option value="yes" ${a.subscription_done?'selected':''}>Oui</option><option value="no" ${!a.subscription_done?'selected':''}>Non</option></select></label><label class="es-gps wide-field">Adresse<textarea id="esAddress" rows="2">${val(a.address)}</textarea></label><label>Date et heure<input id="esDate" type="datetime-local" value="${val((a.sold_at||'').replace(' ','T').slice(0,16))}"></label><label class="wide-field">Note<textarea id="esNotes" rows="2">${val(a.notes)}</textarea></label></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="updateSale(${a.id})">Enregistrer les modifications</button></div>`;editSaleTypeChanged();editSaleCalc()}
function editSaleTypeChanged(){const gps=$('esType').value==='GPS';document.querySelectorAll('.es-gps').forEach(e=>e.style.display=gps?'flex':'none');$('esAmountLabel').firstChild.textContent=gps?'Montant':'Montant à payer'}
function editSaleCalc(){if(!$('esMonths'))return;let months=Math.max(0,Number($('esMonths').value)||0);let base=Number($('esAmount').value)||0;$('esTotalSub').value=3000*months;$('esTotalAmount').value=base+3000+(3000*months)}
async function updateSale(id){const months=Math.max(0,Number($('esMonths')?.value)||0);try{await api('/api/sales/'+id+'/edit','POST',{device_type:$('esType').value,device_name:$('esName')?.value||'',client_name:$('esClient').value,mobile:$('esMobile').value,device_phone:'',sim_number:$('esSimNumber')?.value||'',gps_type:$('esGpsType')?.value||'',address:$('esAddress').value,setup_by:'',amount:Number($('esAmount').value)||0,subscription_months:months,subscription:3000*months,subscription_done:$('esSubDone').value==='yes',sold_at:$('esDate').value,notes:$('esNotes').value});closeModal();flash('Vente modifiée avec succès.');sales()}catch(e){alert(e.message)}}
async function deleteSale(id){if(!confirm('Supprimer cette vente ?'))return;try{await api('/api/sales/'+id,'DELETE');flash('Vente supprimée.');sales()}catch(e){alert(e.message)}}
async function deleteDeposit(id){if(!confirm('Supprimer ce dépôt ?'))return;try{await api('/api/deposits/'+id,'DELETE');flash('Dépôt supprimé.');deposits()}catch(e){alert(e.message)}}
function openDeposit(){$('modalBack').style.display='flex';$('modal').innerHTML='<h2>Ajouter un dépôt</h2><p class="muted">Utilisez Finance / Dépôts pour saisir tous les détails du dépôt.</p><div class="modalfoot"><button class="btn" onclick="closeModal()">Fermer</button><button class="btn primary" onclick="closeModal();showPage(\'deposits\')">Ouvrir la finance</button></div>'}
function openSale(){closeModal();showPage('sales')}
function closeModal(){$('modalBack').style.display='none'}
$('password')?.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
